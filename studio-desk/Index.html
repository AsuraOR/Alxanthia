      html += '<p class="why">' + (isPickup ? 'Sudah diambil' : 'Sudah diterima') + ' ' + esc(fmtStamp(delivery.completedAt)) + '.</p>';
    }

    var deliveryPending = isPending(o.ref, 'delivery');
    var readyIdx = PHASES.findIndex(function (x) { return x.key === 'Ready for dispatch'; });
    var phaseIdx = PHASES.findIndex(function (x) { return x.key === o.phase; });
    if (o.payment !== 'Cancelled' && phaseIdx >= readyIdx && !o.blocker) {
      if (!delivery.handoffAt) {
        html += '<div class="actions"><button type="button" class="btn ghost small" data-markhandoff="1"' +
          (deliveryPending ? ' disabled' : '') + '>' +
          (isPickup ? 'Tandai siap diambil' : 'Tandai diserahkan ke kurir') + '</button></div>';
      } else if (!delivery.completedAt) {
        html += '<div class="actions"><button type="button" class="btn ghost small" data-markdeliverycomplete="1"' +
          (deliveryPending ? ' disabled' : '') + '>' +
          (isPickup ? 'Tandai sudah diambil' : 'Tandai sudah diterima') + '</button></div>';
      }
    }
    return html + '</div>';
  }

  function deliveryFormHtml(o, delivery) {
    if (!deliveryForm) {
      return '<div class="actions"><button type="button" class="btn ghost small" data-opendeliveryform="1">Lengkapi info pengantaran</button></div>';
    }
    var deliveryPending = isPending(o.ref, 'delivery');
    return '<div class="confirm">' +
      '<div class="ongkir"><label for="delivRecipient">Nama penerima</label>' +
      '<input id="delivRecipient" type="text" maxlength="200" value="' + esc(deliveryForm.recipientName || '') + '"' + (deliveryPending ? ' disabled' : '') + '></div>' +
      '<div class="ongkir" style="margin-top:10px"><label for="delivContact">Kontak penerima</label>' +
      '<input id="delivContact" type="text" maxlength="200" value="' + esc(deliveryForm.recipientContact || '') + '"' + (deliveryPending ? ' disabled' : '') + '></div>' +
      '<div class="ongkir" style="margin-top:10px"><label for="delivDetail">Detail lokasi</label>' +
      '<input id="delivDetail" type="text" maxlength="500" value="' + esc(deliveryForm.destinationDetail || '') + '"' + (deliveryPending ? ' disabled' : '') + '></div>' +
      '<div class="ongkir" style="margin-top:10px"><label for="delivCourier">Kurir</label>' +
      '<input id="delivCourier" type="text" maxlength="200" value="' + esc(deliveryForm.courier || '') + '"' + (deliveryPending ? ' disabled' : '') + '></div>' +
      '<div class="ongkir" style="margin-top:10px"><label for="delivTracking">Nomor/tautan lacak</label>' +
      '<input id="delivTracking" type="text" maxlength="500" value="' + esc(deliveryForm.tracking || '') + '"' + (deliveryPending ? ' disabled' : '') + '></div>' +
      '<div class="actions">' +
      '<button type="button" class="btn" data-submitdelivery="1"' + (deliveryPending ? ' disabled' : '') + '>Simpan</button>' +
      '<button type="button" class="btn ghost" data-canceldeliveryform="1"' + (deliveryPending ? ' disabled' : '') + '>Batal</button>' +
      '</div></div>';
  }

  function submitDeliveryForm(o) {
    var recipientName = (document.getElementById('delivRecipient') || {}).value || '';
    var recipientContact = (document.getElementById('delivContact') || {}).value || '';
    var destinationDetail = (document.getElementById('delivDetail') || {}).value || '';
    var courier = (document.getElementById('delivCourier') || {}).value || '';
    var tracking = (document.getElementById('delivTracking') || {}).value || '';
    var key = o.ref + '|delivery';
    if (pending[key]) return;
    pending[key] = true;
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        delete pending[key];
        if (res && res.ok) {
          o.delivery = res.delivery;
          deliveryForm = false;
          toast('Info pengantaran tersimpan.');
        } else {
          toast(esc((res && res.message) || 'Gagal menyimpan info pengantaran.'), true);
        }
        render();
      })
      .withFailureHandler(function (err) {
        delete pending[key];
        toast(esc(String((err && err.message) || err)), true);
        render();
      })
      .setDeliveryInfo({
        ref: o.ref, recipientName: recipientName, recipientContact: recipientContact,
        destinationDetail: destinationDetail, courier: courier, tracking: tracking
      });
  }

  function markHandoffAction(o) {
    var key = o.ref + '|delivery';
    if (pending[key]) return;
    pending[key] = true;
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        delete pending[key];
        if (res && res.ok) { o.delivery = res.delivery; toast('Pengantaran ditandai.'); }
        else toast(esc((res && res.message) || 'Gagal menandai.'), true);
        render();
      })
      .withFailureHandler(function (err) {
        delete pending[key];
        toast(esc(String((err && err.message) || err)), true);
        render();
      })
      .markHandoff({ ref: o.ref });
  }

  function markDeliveryCompleteAction(o) {
    var key = o.ref + '|delivery';
    if (pending[key]) return;
    pending[key] = true;
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        delete pending[key];
        if (res && res.ok) { o.delivery = res.delivery; toast('Pesanan ditandai selesai diterima.'); }
        else toast(esc((res && res.message) || 'Gagal menandai.'), true);
        render();
      })
      .withFailureHandler(function (err) {
        delete pending[key];
        toast(esc(String((err && err.message) || err)), true);
        render();
      })
      .markDeliveryComplete({ ref: o.ref });
  }

  /* SD-11 — a blocker that holds forward phase movement and handoff but
     never payment, notes, or moving backward — see updateOrder()'s own
     "moving forward" check in Code.gs, which this banner surfaces. */
  function blockerBanner(o) {
    if (!o.blocker) return '';
    var blockerPending = isPending(o.ref, 'blocker');
    return '<div class="block" style="border-color:var(--madder)"><h3 style="color:var(--madder)">Ada kendala</h3>' +
      '<p class="why">' + esc(o.blocker.reason) + (o.blocker.note ? ' — ' + esc(o.blocker.note) : '') + '</p>' +
      '<p class="why">Sejak ' + esc(fmtStamp(o.blocker.openedAt)) + '</p>' +
      '<div class="actions"><button type="button" class="btn" data-resolveblocker="1"' +
      (blockerPending ? ' disabled' : '') + '>Kendala selesai</button></div></div>';
  }

  function blockerActionBlock(o) {
    if (o.blocker) return '';
    if (!blockerForm) {
      return '<div class="block"><button type="button" class="btn ghost" data-openblockerform="1">Ada kendala</button></div>';
    }
    var blockerPending = isPending(o.ref, 'blocker');
    return '<div class="block"><h3>Ada kendala</h3><div class="confirm">' +
      '<span class="k">Alasan</span>' +
      '<div class="seg" role="group" aria-label="Alasan kendala" style="flex-wrap:wrap">' +
      BLOCKER_REASONS.map(function (r) {
        return '<button type="button" data-blockerreason="' + esc(r.key) + '" aria-pressed="' + (blockerForm.reason === r.key) +
          '"' + (blockerPending ? ' disabled' : '') + '>' + esc(r.label) + '</button>';
      }).join('') + '</div>' +
      '<div class="ongkir" style="margin-top:10px"><label for="blockerNote">Catatan (opsional)</label>' +
      '<input id="blockerNote" type="text" maxlength="500" value="' + esc(blockerForm.note || '') + '"' + (blockerPending ? ' disabled' : '') + '></div>' +
      '<div class="actions">' +
      '<button type="button" class="btn" data-submitblocker="1"' + (blockerPending || !blockerForm.reason ? ' disabled' : '') + '>Simpan</button>' +
      '<button type="button" class="btn ghost" data-cancelblockerform="1"' + (blockerPending ? ' disabled' : '') + '>Batal</button>' +
      '</div></div></div>';
  }

  function submitBlockerForm(o) {
    if (!blockerForm || !blockerForm.reason) return;
    var note = (document.getElementById('blockerNote') || {}).value || '';
    var key = o.ref + '|blocker';
    if (pending[key]) return;
    pending[key] = true;
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        delete pending[key];
        if (res && res.ok) {
          o.blocker = res.blocker;
          blockerForm = false;
          toast('Kendala dicatat.');
        } else {
          toast(esc((res && res.message) || 'Gagal mencatat kendala.'), true);
        }
        render();
      })
      .withFailureHandler(function (err) {
        delete pending[key];
        toast(esc(String((err && err.message) || err)), true);
        render();
      })
      .setBlocker({ ref: o.ref, reason: blockerForm.reason, note: note });
  }

  function resolveBlockerAction(o) {
    var key = o.ref + '|blocker';
    if (pending[key]) return;
    pending[key] = true;
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        delete pending[key];
        if (res && res.ok) {
          o.blocker = res.blocker;
          toast('Kendala ditandai selesai.');
        } else {
          toast(esc((res && res.message) || 'Gagal menandai kendala selesai.'), true);
        }
        render();
      })
      .withFailureHandler(function (err) {
        delete pending[key];
        toast(esc(String((err && err.message) || err)), true);
        render();
      })
      .resolveBlocker({ ref: o.ref });
  }

  /* SD-09 — the composition editor for a package-type line ("pilihan bunga
     studio"): the buyer only picked a stem-count tier, so the studio
     records which specific flowers filled it. lineKey is the same
     content-derived key the checklist uses for this line. */
  function compositionEditorHtml(o, c) {
    var compPending = isPending(o.ref, 'composition:' + c.contentKey);
    if (editingComposition !== c.contentKey) {
      return '<div class="actions" style="margin-top:6px">' +
        '<button type="button" class="btn ghost small" data-opencomposition="' + esc(c.contentKey) +
        '" data-packageindex="' + c.packageIndex + '">' +
        (c.composition ? 'Ubah komposisi' : 'Atur komposisi') + '</button></div>';
    }
    var draft = compositionDraft || { stems: {}, additions: {} };
    var flowers = state.catalog.flowers || {};
    var additions = state.catalog.additions || {};
    var total = Object.keys(draft.stems).reduce(function (sum, k) { return sum + (Number(draft.stems[k]) || 0); }, 0);
    var html = '<div class="confirm" style="margin-top:6px">' +
      '<span class="k" id="compositionTotal">Komposisi (' + total + '/' + (c.requiredStems || '?') + ' tangkai)</span>';
    Object.keys(flowers).forEach(function (k) {
      html += '<div class="ongkir" style="margin-top:6px"><label for="stem-' + esc(k) + '">' + esc(flowers[k].name || k) + '</label>' +
        '<input id="stem-' + esc(k) + '" type="number" inputmode="numeric" min="0" step="1" data-stemkey="' + esc(k) +
        '" value="' + (draft.stems[k] || '') + '"' + (compPending ? ' disabled' : '') + '></div>';
    });
    if (Object.keys(additions).length) {
      html += '<span class="k" style="display:block;margin-top:10px">Tambahan</span>';
      Object.keys(additions).forEach(function (k) {
        html += '<div class="ongkir" style="margin-top:6px"><label for="add-' + esc(k) + '">' + esc(additions[k].name || k) + '</label>' +
          '<input id="add-' + esc(k) + '" type="number" inputmode="numeric" min="0" step="1" data-additionkey="' + esc(k) +
          '" value="' + (draft.additions[k] || '') + '"' + (compPending ? ' disabled' : '') + '></div>';
      });
    }
    html += '<div class="actions">' +
      '<button type="button" class="btn" data-submitcomposition="' + esc(c.contentKey) + '" data-packageindex="' + c.packageIndex +
      '"' + (compPending ? ' disabled' : '') + '>Simpan</button>' +
      '<button type="button" class="btn ghost" data-cancelcomposition="1"' + (compPending ? ' disabled' : '') + '>Batal</button>' +
      '</div></div>';
    return html;
  }

  function updateCompositionTotal() {
    var el = document.getElementById('compositionTotal');
    if (!el || !compositionDraft) return;
    var total = Object.keys(compositionDraft.stems || {}).reduce(function (sum, k) { return sum + (Number(compositionDraft.stems[k]) || 0); }, 0);
    el.textContent = 'Komposisi (' + total + '/' + (compositionRequiredStems || '?') + ' tangkai)';
  }

  function submitCompositionForm(o, lineKey, packageIndex) {
    var stems = {};
    Object.keys((compositionDraft && compositionDraft.stems) || {}).forEach(function (k) {
      var n = Number(compositionDraft.stems[k]);
      if (isFinite(n) && n > 0) stems[k] = n;
    });
    var additions = {};
    Object.keys((compositionDraft && compositionDraft.additions) || {}).forEach(function (k) {
      var n = Number(compositionDraft.additions[k]);
      if (isFinite(n) && n > 0) additions[k] = n;
    });
    var key = o.ref + '|composition:' + lineKey;
    if (pending[key]) return;
    pending[key] = true;
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        delete pending[key];
        if (res && res.ok) {
          var rows = state.composition[o.ref] || [];
          var idx = rows.findIndex(function (r) { return r.lineKey === lineKey; });
          var entry = { lineKey: lineKey, composition: res.composition, updatedAt: '', updatedBy: '' };
          if (idx !== -1) rows[idx] = entry; else rows.push(entry);
          state.composition[o.ref] = rows;
          editingComposition = null;
          compositionDraft = null;
          toast('Komposisi tersimpan.');
          /* A composition change invalidates this same line's checklist tick
             server-side (see setComposition() in Code.gs) — refetch so the
             local cache doesn't keep showing a stale, already-ticked box. */
          google.script.run
            .withSuccessHandler(function (rows2) {
              applyServerChecklist(o.ref, o.items, rows2 || []);
              if (state.selected === o.ref) renderTicket();
            })
            .withFailureHandler(function () {})
            .getChecklist(o.ref);
        } else {
          toast(esc((res && res.message) || 'Gagal menyimpan komposisi.'), true);
        }
        render();
      })
      .withFailureHandler(function (err) {
        delete pending[key];
        toast(esc(String((err && err.message) || err)), true);
        render();
      })
      .setComposition({ ref: o.ref, lineKey: lineKey, packageIndex: packageIndex, stems: stems, additions: additions });
  }

  /* SD-03 — read-only activity feed, collapsed like the provenance block
     since it's reference material, not something she needs open by
     default. */
  function riwayatBlock(o) {
    var rows = state.activity[o.ref] || [];
    if (!rows.length) return '';
    return '<details class="provenance"><summary>Riwayat (' + rows.length + ')</summary>' +
      rows.map(function (r) { return '<span>' + esc(fmtStamp(r.at)) + ' — ' + esc(r.detail) + '</span>'; }).join('') +
      '</details>';
  }

  function generateIdempotencyKey() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return 'idem-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  }

  /* The most destructive action in the Desk, on its own at the bottom of
     the ticket instead of sharing an .actions row with routine payment
     buttons — see P3-6 in STUDIO-DESK-UX-REVIEW.md. The confirm step
     (unchanged) still guards it. */
  function cancelBlock(o) {
    if (o.payment === 'Cancelled') return '';
    var html = '<div class="block"><button type="button" class="btn ghost" data-askcancel="1">Batalkan pesanan</button>';
    if (confirming === 'cancel') {
      html += '<div class="confirm"><p>Batalkan pesanan ' + esc(o.ref) + '? Pesanan akan ditandai dibatalkan.</p>' +
        '<div class="actions"><button type="button" class="btn" data-pay="Cancelled" data-fk="confirm-primary">Ya, batalkan</button>' +
        '<button type="button" class="btn ghost" data-cancelconfirm="1">Tidak</button></div></div>';
    }
    return html + '</div>';
  }

  function paymentBlock(o) {
    var pay = o.payment;
    if (pay === 'Paid') {
      var paidAmount = billed(o);
      return '<div class="block"><h3 data-fk="paymentHeading" tabindex="-1">Pembayaran</h3>' +
        '<div class="paid-line"><span class="ok">Lunas</span>' +
        '<span class="amt">' + esc(paidAmount === null ? '—' : rupiah(paidAmount)) + '</span></div>' +
        '<div class="breakdown"><span>Produk &amp; kartu ' + esc(rupiah(o.verified)) + '</span>' +
        '<span>Ongkir ' + (o.shipping === null || o.shipping === undefined || o.shipping === ''
          ? 'belum diisi' : esc(rupiah(o.shipping))) + '</span></div>' +
        '<div class="actions">' +
        '<button type="button" class="btn ghost" data-sendpaid="1">Kirim konfirmasi lunas</button>' +
        '</div></div>';
    }

    var ship = o.shipping;
    var amount = billed(o);
    var deposit = depositAmount(o);
    var balance = balanceAmount(o);
    var isDeposit = usesDeposit(o);
    var shippingPending = isPending(o.ref, 'shipping');
    var paymentPending = isPending(o.ref, 'payment');
    var planPending = isPending(o.ref, 'paymentPlan');
    var shipErr = fieldErrors[o.ref + '|shipping'];
    var payErr = fieldErrors[o.ref + '|payment'] || fieldErrors[o.ref + '|paymentPlan'];
    var bank = state.catalog.bank || {};
    var bankReady = !!bank.number;
    var readyIndex = PHASES.findIndex(function (x) { return x.key === 'Ready for dispatch'; });
    var phaseIndex = PHASES.findIndex(function (x) { return x.key === o.phase; });
    var balanceDue = phaseIndex >= readyIndex;

    var html = '<div class="block pay-open"><h3 data-fk="paymentHeading" tabindex="-1">Pembayaran</h3>' +
      '<div class="amount"><span class="big">' + esc(amount === null ? '—' : rupiah(amount)) + '</span>' +
      '<span class="lbl">total yang ditagih ke pembeli</span></div>' +
      '<div class="breakdown"><span>Produk &amp; kartu ' + esc(rupiah(o.verified)) + '</span>' +
      '<span>Ongkir ' + (ship === null || ship === undefined || ship === '' ? 'belum diisi' : esc(rupiah(ship))) + '</span></div>';

    /* A segmented toggle, not two same-weight buttons next to Tandai lunas —
       see P3-2 in STUDIO-DESK-UX-REVIEW.md. Placed right under the total it
       explains, and locked once a transfer has actually started (mirroring
       the server's own PAYMENT_STARTED check — a convenience, not the real
       guard; ground rule 5). */
    var planLocked = pay !== 'Unpaid';
    html += '<div style="margin-top:14px"><span class="k">Cara pembayaran</span>' +
      '<div class="seg" role="group" aria-label="Cara pembayaran">' +
      '<button type="button" data-plan="Full" aria-pressed="' + (!isDeposit) + '"' +
        (planLocked || planPending ? ' disabled' : '') + '>Bayar penuh</button>' +
      '<button type="button" data-plan="Deposit 50%" aria-pressed="' + isDeposit + '"' +
        (planLocked || planPending || amount === null ? ' disabled' : '') + '>DP 50%</button></div>' +
      (planLocked ? '<span class="hint" style="display:block;margin-top:6px">Cara pembayaran terkunci setelah pembayaran mulai diproses.</span>' : '') +
      '</div>';

    if (isDeposit && amount !== null) {
      html += '<div class="breakdown"><span>DP 50% ' + esc(rupiah(deposit)) + '</span>' +
        '<span>Sisa pelunasan ' + esc(rupiah(balance)) + '</span></div>';
    }

    if (o.locationType === 'bali') {
      html += '<div class="ongkir"><span class="hint">Ongkir Rp 0 — ' +
        (o.method === 'self_pickup' ? 'diambil sendiri di studio.' : 'Grab/Gojek dibayar langsung ke driver.') +
        '</span></div>';
    } else {
      /* A bare number input reads ambiguously (45000 vs 450000) for a
         figure that goes straight onto the customer's bill — a static Rp
         prefix plus a live formatted echo fix that without fighting the
         numeric keypad. See P3-4 in STUDIO-DESK-UX-REVIEW.md. */
      html += '<div class="ongkir"><label for="ongkir-' + esc(o.ref) + '">Ongkir</label>' +
        '<span class="amtwrap"><span class="prefix" aria-hidden="true">Rp</span>' +
        '<input id="ongkir-' + esc(o.ref) + '" type="number" inputmode="numeric" min="0" step="1000" ' +
        'value="' + (ship === null || ship === undefined ? '' : esc(ship)) + '" placeholder="0"' +
        (shippingPending ? ' disabled' : '') + '></span>' +
        '<span class="hint" id="ongkirEcho">' + (ship === null || ship === undefined || ship === '' ? '' : ('= ' + esc(rupiah(ship)))) + '</span>' +
        '<span class="hint">Kurir ke ' + esc(o.city) + '. Sisa pelunasan mengikuti total terbaru.</span>' +
        '<span class="hint" id="shippingSaving"' + (shippingPending ? '' : ' hidden') + '>Menyimpan…</span></div>';
      /* Right under the field it explains, not after the action buttons
         below it — see P3-3 in STUDIO-DESK-UX-REVIEW.md. */
      if (amount === null) html += '<p class="why">Isi ongkir dulu supaya totalnya bisa ditagih.</p>';
      if (shipErr) html += '<p class="why err">' + esc(shipErr) + '</p>';
    }

    if (pay === 'Cancelled') {
      html += '<div class="paid-line"><span class="cancelled">Dibatalkan</span></div>';
      if (isDeposit) {
        /* Un-cancelling used to always reset to Unpaid, silently erasing the
           record that a deposit had already landed — see P1-5 in
           STUDIO-DESK-UX-REVIEW.md. Ask instead of guessing. */
        html += '<span class="why">Jika DP sudah diterima sebelum dibatalkan, aktifkan lewat tombol pertama supaya pembeli tidak diminta bayar dua kali.</span>' +
          '<div class="actions">' +
          '<button type="button" class="btn" data-pay="Deposit paid">Aktifkan — DP sudah diterima</button>' +
          '<button type="button" class="btn ghost" data-pay="Unpaid">Aktifkan — belum ada pembayaran</button>' +
          '</div>';
      } else {
        html += '<div class="actions"><button type="button" class="btn ghost" data-pay="Unpaid">Aktifkan lagi</button></div>';
      }
    } else if (isDeposit) {
      var depositReceived = pay === 'Deposit paid' || pay === 'Checking balance';
      html += '<div class="paid-line"><span class="' + (depositReceived ? 'ok' : '') + '">' +
        (depositReceived ? 'DP diterima' : (pay === 'Checking deposit' ? 'DP perlu dicek' : 'Belum bayar DP')) + '</span>' +
        '<span class="amt">' + esc(rupiah(depositReceived ? balance : deposit)) + '</span></div>' +
        '<div class="actions">' +
        (!depositReceived
          ? '<button type="button" class="btn ghost" data-sendpayment="deposit"' + (bankReady ? '' : ' disabled') + '>Kirim tagihan DP</button>' +
            '<button type="button" class="btn ghost" data-pay="Checking deposit">Tandai DP perlu dicek</button>' +
            '<button type="button" class="btn" data-askpaid="Deposit paid">Tandai DP diterima</button>'
          : (balanceDue
            ? (o.phase === 'Ready for dispatch'
                ? '<button type="button" class="btn" data-sendpayment="balance"' + (bankReady ? '' : ' disabled') + '>Kirim pesan pelunasan</button>'
                : '') +
              '<button type="button" class="btn ghost" data-pay="Checking balance">Tandai perlu dicek</button>' +
              '<button type="button" class="btn" data-askpaid="Paid">Tandai lunas</button>'
            : '<span class="why">Pelunasan diminta saat pesanan Siap dikirim.</span>')) +
        '</div>';
    } else {
      html += '<div class="actions"><button type="button" class="btn ghost" data-sendpayment="full"' + (bankReady ? '' : ' disabled') + '>Kirim pesan</button>' +
        '<button type="button" class="btn ghost" data-pay="Checking transfer">Tandai perlu dicek</button>' +
        '<button type="button" class="btn" data-askpaid="Paid">Tandai lunas</button></div>';
    }

    if (!bankReady) html += '<span class="why">Nomor rekening belum diisi — pesan pembayaran tidak bisa dikirim.</span>';
    if (payErr) html += '<span class="why err">' + esc(payErr) + '</span>';
    if (confirming && confirming !== 'cancel' && amount !== null) {
      var target = confirming === 'Deposit paid' ? deposit : (confirming === 'Paid' && isDeposit ? balance : amount);
      html += '<div class="confirm"><p><b>' + esc(rupiah(target)) + '</b> sudah masuk ke rekening ' +
        esc(bank.bank || '—') + ' ' + esc(bank.number || '') + '?</p>' +
        '<p class="rule">Cek di mutasi rekening — jangan dari screenshot pembeli.</p>' +
        '<div class="actions"><button type="button" class="btn" data-pay="' + esc(confirming) + '" data-fk="confirm-primary">Ya, sudah masuk</button>' +
        '<button type="button" class="btn ghost" data-cancelconfirm="1">Batal</button></div></div>';
    }
    return html + '</div>';
  }

  function renderTicket() {
    var o = findOrder(state.selected);
    if (!o) { elTicket.innerHTML = '<div class="block"><p class="why">Pilih pesanan dari daftar.</p></div>'; return; }
    var catalog = state.catalog;
    markSeen(o);
    loadTicketExtras(o);

    var p = per(o.ref);
    var g = gate(o, catalog);
    var comps = buildList(o, catalog);
    var ticks = p.ticks || {};
    var compState = p.comps || {};
    var doneComps = comps.filter(function (c) { return compState[c.key]; }).length;
    var d = daysUntil(o.date);
    var phase = o.phase;
    var pIndex = PHASES.findIndex(function (x) { return x.key === phase; });
    var headCls = phase === 'Delivered' ? '' : (d < 0 ? ' is-late' : (d === 0 ? ' is-today' : ''));
    var phasePending = isPending(o.ref, 'phase');
    var phaseErr = fieldErrors[o.ref + '|phase'];
    var notesPending = isPending(o.ref, 'notes');

    var phaseEntry = PHASES.find(function (x) { return x.key === phase; });

    var html = '<button type="button" class="back" data-back="1">← Daftar pesanan</button>' +
      '<div class="ticket-head' + headCls + '">' +
        '<div class="id"><div class="ref">' + esc(o.ref) + '</div>' +
          (phaseEntry ? '<span class="tag go" style="margin:5px 0 1px">' + esc(phaseEntry.label) + '</span>' : '') +
          '<h2>' + esc(o.buyer) + '</h2>' +
          '<a class="wa" href="https://wa.me/' + esc(String(o.wa).replace('+', '')) + '" target="_blank" rel="noopener">' + esc(o.wa) + '</a>' +
          '<span class="in">masuk ' + esc(fmtStamp(o.submitted)) + '</span></div>' +
        '<div class="when"><span class="d">' + esc(fmtDateLong(o.date)) + '</span>' +
          '<span class="rel">' + esc(relDate(o.date)) + '</span></div>' +
      '</div>';

    /* SD-06 — one prominent, clickable primary action when the current
       stage has one (the brief's own 8-row table); otherwise SD-05's plain
       next-action text (blocked, missing info, overdue-only, "just keep
       working" — none of which are a single button). Skipped entirely
       when a blocker is open — blockerBanner() below already says so, with
       its own resolve action; repeating "Kendala: ..." here would just be
       noise. Same underlying nextAction()/primaryAction() the card itself
       used to pick this order, so the queue and the open ticket never
       disagree about what to do next. */
    var pAction = primaryAction(o, catalog);
    var ticketAction = nextAction(o);
    if (!o.blocker && pAction) {
      html += '<button type="button" class="btn primary-action-btn" ' + pAction.attrs + '>' + esc(pAction.text) + '</button>';
    } else if (!o.blocker && ticketAction) {
      html += '<p class="next-action-banner">' + esc(ticketAction) + '</p>';
    }

    html += blockerBanner(o);
    html += reviewBlock(o);
    html += paymentBlock(o);
    html += ledgerBlock(o);
    html += scheduleBlock(o);

    var isCancelled = o.payment === 'Cancelled';
    if (isCancelled) {
      /* A cancelled order can still show working controls (start, tick
         items, advance phase) that make no sense once it's cancelled — see
         P5-5 in STUDIO-DESK-UX-REVIEW.md. Collapse make/finishing/phase
         behind one line; the reactivation path stays in paymentBlock(). */
      html += '<div class="block"><p class="why">Pesanan ini dibatalkan — detail pembuatan dan tahap kerja' +
        ' disembunyikan. Aktifkan kembali di atas untuk melanjutkan.</p></div>';
    }

    /* Verification gate — only while the work has not started. */
    if (!isCancelled && pIndex <= 0) {
      html += '<div class="block"><h3>Periksa dulu</h3><ul class="checks">' +
        g.auto.map(function (c) {
          return '<li class="' + (c.ok ? 'pass' : 'fail') + '"><span class="mark" aria-hidden="true">' +
            (c.ok ? '✓' : '✕') + '</span><span>' + esc(c.label) +
            '<span class="sub">' + esc(c.sub) + '</span></span></li>';
        }).join('') + '</ul>' +
        g.manual.map(function (m) {
          var on = !!ticks[m.key];
          return '<button type="button" class="tick" data-tick="' + esc(m.key) + '" data-fk="tick-' + esc(m.key) +
            '" aria-pressed="' + on + '"><span class="box" aria-hidden="true">✓</span>' +
            '<span class="label">' + esc(m.label) + '</span></button>';
        }).join('') +
        '<div class="actions"><button type="button" class="btn" data-advance="1"' + (g.ready && !phasePending ? '' : ' disabled') + '>' +
        (g.ready && !g.allOk ? 'Tetap mulai kerjakan' : 'Mulai kerjakan') + '</button><span class="why' + (phaseErr ? ' err' : '') + '">' +
        (phaseErr || (g.ready
          ? (g.allOk ? '' : 'Tanggalnya sudah lewat — kabari pembeli dulu kalau perlu.')
          : (g.autoOk ? 'Centang baris di atas dulu.' : 'Belum bisa dimulai — lihat tanda merah di atas.'))) +
        '</span></div></div>';
    }

    if (!isCancelled) {
      /* What to make — one tick per line item. */
      html += '<div class="block"><h3>Yang dibuat<span class="count" id="compCount">' + doneComps + '/' + comps.length + ' item</span></h3>' +
        (comps.length
          ? '<ul class="make">' + comps.map(function (c) {
              var on = !!compState[c.key];
              var li = '<li><button type="button" class="comp" data-comp="' + esc(c.key) + '" data-contentkey="' + esc(c.contentKey) +
                '" data-fk="comp-' + esc(c.key) +
                '" aria-pressed="' + on + '"><span class="box" aria-hidden="true">✓</span>' +
                '<span class="qty">' + c.qty + '×</span><span><span class="name">' + esc(c.name) + '</span>' +
                c.lines.map(function (l) {
                  return '<span class="spec">' + (l.k ? '<span class="k">' + esc(l.k) + ':</span> ' : '') + esc(l.v) + '</span>';
                }).join('') +
                '</span></button>';
              if (c.isPackage) li += compositionEditorHtml(o, c);
              return li + '</li>';
            }).join('') + '</ul>'
          : '<p class="why">' + esc(o.itemsRaw || 'Tidak ada rincian item.') + '</p>') + '</div>';

      /* Finishing — bouquet colour (when relevant) and the card. Individual
         flower wrapping is shown on its own item line above. */
      html += '<div class="block"><h3>Penyelesaian</h3>';
      if (usesBouquetWrap(o.items)) {
        var w = catalog.wraps[o.wrap] || { name: humanizeKey(o.wrap), swatch: '#999' };
        html += '<div class="pair"><span class="k">Warna kertas buket</span><span class="v">' +
          '<span class="swatch" style="background:' + esc(w.swatch) + '"></span>' + esc(w.name) + '</span></div>';
      }

      if (o.card) {
        html += '<div style="margin-top:15px"><span class="k" style="display:block;font:600 10.5px/1 var(--sans);' +
          'letter-spacing:.11em;text-transform:uppercase;color:var(--muted)">Kartu ucapan — tulis apa adanya</span>' +
          '<div class="cardnote"><p>' + esc(o.card.text) + '</p>' +
          '<div class="meta"><span>Untuk: ' + esc(o.card.to) + '</span><span>Dari: ' + esc(o.card.from) + '</span></div>' +
          '<div class="actions"><button type="button" class="btn ghost small" data-copycard="1">Salin teks kartu</button></div>' +
          '</div></div>';
      } else {
        html += '<p style="margin:14px 0 0;font-size:13px;color:var(--muted)">Tanpa kartu ucapan.</p>';
      }
      html += '</div>';
    }

    /* Delivery — kept visible even when cancelled; it's information, not a
       working control. */
    html += deliveryBlock(o);

    var packingRequired = !isCancelled && phase === 'Assembly and packing';
    if (packingRequired) {
      /* SD-02: a distinct final packing checklist, separate from the
         per-item make list — required before Lanjut out of this phase. */
      var packingState = per(o.ref).packing || {};
      html += '<div class="block"><h3 data-fk="packingHeading" tabindex="-1">Cek sebelum siap kirim</h3>' +
        packingItemsFor(o).map(function (item) {
          var on = !!packingState[item.key];
          return '<button type="button" class="tick" data-packing="' + esc(item.key) + '" data-fk="packing-' + esc(item.key) +
            '" aria-pressed="' + on + '"><span class="box" aria-hidden="true">✓</span>' +
            '<span class="label">' + esc(item.label) + '</span></button>';
        }).join('') + '</div>';
    }

    if (!isCancelled) {
      /* Work phase — all five (Cancelled aside) are hers. */
      html += '<div class="block"><h3 data-fk="phaseHeading" tabindex="-1">Tahap kerja</h3><div class="phases">' +
        PHASES.map(function (x, i) {
          var cls = i < pIndex ? 'done' : (i === pIndex ? 'now' : '');
          return '<div class="phase ' + cls + '"><span class="line"></span><span class="t">' + esc(x.label) + '</span></div>';
        }).join('') + '</div>';

      var next = PHASES[pIndex + 1];
      var packingBlocksAdvance = packingRequired && !packingComplete(o);
      var blockerBlocksAdvance = !!o.blocker;
      if (pIndex > 0 || !next) {
        html += '<div class="actions">' +
          (next ? '<button type="button" class="btn" data-advance="1"' + (phasePending || packingBlocksAdvance || blockerBlocksAdvance ? ' disabled' : '') + '>Lanjut: ' + esc(next.label) + '</button>'
                : '<span class="why">Pesanan selesai.</span>') +
          (pIndex > 0 ? '<button type="button" class="btn ghost" data-retreat="1"' + (phasePending ? ' disabled' : '') +
            '>Kembali: ' + esc(PHASES[pIndex - 1].label) + '</button>' : '') +
          (pIndex > 0 ? '<button type="button" class="btn ghost" data-sendphase="1">Kirim pesan</button>' : '') +
          (phaseErr && pIndex > 0 ? '<span class="why err">' + esc(phaseErr) + '</span>' :
            (packingBlocksAdvance ? '<span class="why">Centang dulu semua item pengecekan kemasan di atas.</span>' :
              (blockerBlocksAdvance ? '<span class="why">Selesaikan kendala di atas dulu sebelum melanjutkan.</span>' : ''))) +
          '</div>';
      }
      html += '</div>';
      html += blockerActionBlock(o);
    }

    /* One story, not three: notes auto-save on blur, and the status line
       says what's actually true — quiet when saved, honest while saving or
       failed, with a retry only when there's something to retry. The old
       explicit Simpan catatan button was usually a no-op (tapping anything
       else already blurred and saved the field) and taught the opposite of
       what was happening. See P3-7 in STUDIO-DESK-UX-REVIEW.md. */
    var unsavedNote = noteDrafts[o.ref] !== undefined && noteDrafts[o.ref] !== o.notes;
    var notesErr = fieldErrors[o.ref + '|notes'];
    var notesStatusLabel = notesErr ? 'Gagal menyimpan' : (unsavedNote && !notesPending ? 'Belum tersimpan' : '');
    html += '<div class="block"><h3 data-fk="notesHeading" tabindex="-1">Catatan kerja' +
      (notesStatusLabel ? '<span class="count" style="color:' + (notesErr ? 'var(--madder)' : 'var(--amber)') +
        ';text-transform:none">' + esc(notesStatusLabel) + '</span>' : '') +
      '</h3>' +
      '<textarea class="notes" id="notes-' + esc(o.ref) + '" data-fk="notes" ' +
      (notesPending ? 'disabled ' : '') +
      'placeholder="Catat kalau ada bahan kurang, warna diganti, atau pesan dari pembeli…"></textarea>' +
      '<span class="why" id="notesSaving"' + (notesPending ? '' : ' hidden') + '>Menyimpan…</span>' +
      (notesErr ? '<div class="actions"><span class="why err">' + esc(notesErr) + '</span>' +
        '<button type="button" class="btn ghost small" data-retrynotes="1">Coba lagi</button></div>' : '') +
      '</div>' +
      cancelBlock(o) +
      riwayatBlock(o) +
      '<details class="provenance"><summary>Info teknis</summary>' +
      '<span>Orders · baris ' + o.row + '</span>' +
      '<span>Desk menulis: Payment Plan · Payment Status · Shipping Fee · Work Phase · Internal Notes</span>' +
      '<span>Kolom lain hanya dibaca</span></details>';

    var scrollY = window.scrollY;
    elTicket.innerHTML = html;
    var notesEl = elTicket.querySelector('.notes');
    notesEl.value = noteDrafts[o.ref] !== undefined ? noteDrafts[o.ref] : o.notes;

    /* A full re-render (payment/phase actions) drops focus to <body> unless
       something claims it back — the single biggest reason a keyboard or
       screen-reader user was returned to the top of the document after
       every action. If the exact control named by `refocus` didn't survive
       the change (e.g. it advanced past the phase it belonged to), fall
       back to the nearest block heading rather than losing focus entirely.
       See P4-4 in STUDIO-DESK-UX-REVIEW.md. */
    if (refocus) {
      var target = elTicket.querySelector('[data-fk="' + refocus + '"]') || elTicket.querySelector('.block > h3[data-fk]');
      if (target) target.focus();
      refocus = null;
    }
    window.scrollTo(0, scrollY);

    var nowPhase = elTicket.querySelector('.phase.now');
    var phasesEl = elTicket.querySelector('.phases');
    if (nowPhase && phasesEl) scrollIntoViewHorizontally(phasesEl, nowPhase);
  }

  /* Local bench-state toggles (comp ticks, the manual gate tick) never touch
     the server, so they update the DOM in place instead of tearing down and
     rebuilding the whole ticket for one checkbox — see P1-4 in
     STUDIO-DESK-UX-REVIEW.md. */
  function updateCompCount() {
    var o = findOrder(state.selected);
    if (!o) return;
    var comps = buildList(o, state.catalog);
    var compState = per(o.ref).comps || {};
    var doneComps = comps.filter(function (c) { return compState[c.key]; }).length;
    var countEl = document.getElementById('compCount');
    if (countEl) countEl.textContent = doneComps + '/' + comps.length + ' item';
  }

  function updateAdvanceButtonState() {
    var o = findOrder(state.selected);
    if (!o) return;
    var btn = elTicket.querySelector('[data-advance]');
    if (!btn) return;
    var g = gate(o, state.catalog);
    var phasePending = isPending(o.ref, 'phase');
    btn.disabled = !(g.ready && !phasePending);
    btn.textContent = (g.ready && !g.allOk) ? 'Tetap mulai kerjakan' : 'Mulai kerjakan';
    var why = btn.nextElementSibling;
    if (why && why.classList.contains('why')) {
      var phaseErr = fieldErrors[o.ref + '|phase'];
      why.classList.toggle('err', !!phaseErr);
      why.textContent = phaseErr || (g.ready
        ? (g.allOk ? '' : 'Tanggalnya sudah lewat — kabari pembeli dulu kalau perlu.')
        : (g.autoOk ? 'Centang baris di atas dulu.' : 'Belum bisa dimulai — lihat tanda merah di atas.'));
    }
  }

  /* The phase block's own Lanjut button (distinct from the gate's Mulai
     kerjakan above — only one or the other is ever in the DOM at a time,
     since the gate only renders at pIndex <= 0 and this block's actions
     only render at pIndex > 0). Gated on the packing checklist while
     leaving Dirangkai dan dikemas. See SD-02. */
  function updatePhaseAdvanceButtonState() {
    var o = findOrder(state.selected);
    if (!o) return;
    var btn = elTicket.querySelector('[data-advance]');
    if (!btn) return;
    var phasePending = isPending(o.ref, 'phase');
    var packingRequired = o.phase === 'Assembly and packing';
    var packingBlocksAdvance = packingRequired && !packingComplete(o);
    btn.disabled = phasePending || packingBlocksAdvance;
    var why = btn.nextElementSibling;
    if (why && why.classList.contains('why')) {
      var phaseErr = fieldErrors[o.ref + '|phase'];
      why.classList.toggle('err', !!phaseErr);
      why.textContent = phaseErr || (packingBlocksAdvance ? 'Centang dulu semua item pengecekan kemasan di atas.' : '');
    }
  }

  /* =====================================================================
     Toasts
     ===================================================================== */
  var toastTimer = null;
  function toast(message, isError) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast';
      el.id = 'toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.className = 'toast' + (isError ? ' err' : '');
    el.innerHTML = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
  }

  /* Indonesian labels for the five writable fields — keyed by the page-side
     field name, never the sheet's own column header, so that English column
     text can never reach a string she actually sees. See P3-1 in
     STUDIO-DESK-UX-REVIEW.md. */
  var FIELD_LABELS = {
    paymentPlan: 'Cara pembayaran',
    payment: 'Status pembayaran',
    shipping: 'Ongkir',
    phase: 'Tahap kerja',
    notes: 'Catatan kerja'
  };

  function savedToast(field) {
    toast((FIELD_LABELS[field] || 'Perubahan') + ' tersimpan.');
  }

  /* =====================================================================
     Writes: optimistic with rollback. Applied locally, rendered, sent to
     the server; on success the order is replaced with the server's own
     copy, on failure the previous value comes back and the control
     re-enables so a double-tap can't queue two writes.
     ===================================================================== */
  /* Reflects an in-flight write on a single control without rebuilding the
     ticket — used for fields written from a 'change' handler (see
     writeField's rerender:false path). */
  function setControlPending(field, isPending) {
    if (field === 'shipping') {
      var input = elTicket.querySelector('.ongkir input[type="number"]');
      var marker = document.getElementById('shippingSaving');
      if (input) input.disabled = isPending;
      if (marker) marker.hidden = !isPending;
    } else if (field === 'notes') {
      var textarea = elTicket.querySelector('.notes');
      var marker = document.getElementById('notesSaving');
      if (textarea) textarea.disabled = isPending;
      if (marker) marker.hidden = !isPending;
    }
  }

  function writeField(ref, field, value, opts) {
    opts = opts || {};
    var onSaved = opts.onSaved;
    var key = ref + '|' + field;
    if (pending[key]) return;
    /* Never even attempt an optimistic write while offline — better a
       clear "not saved" message now than a change that quietly never
       reaches the server. See P5-1 in STUDIO-DESK-UX-REVIEW.md. */
    if (!navigator.onLine) {
      toast('Tidak ada koneksi — perubahan belum tersimpan.', true);
      return;
    }
    var order = findOrder(ref);
    if (!order) return;
    var previous = order[field];

    pending[key] = true;
    delete fieldErrors[key];
    order[field] = value;
    /* A field reached via the 'change' event (shipping, notes) fires on
       blur, which on a touch device races the next tap. Tearing the ticket
       down with a full render() here would detach the button she is mid-tap
       on. Update just that one control in place instead; the server
       response re-renders the whole ticket anyway, long after the tap has
       resolved. */
    if (opts.rerender === false) {
      setControlPending(field, true);
    } else {
      render();
    }

    google.script.run
      .withSuccessHandler(function (res) {
        delete pending[key];
        if (res && res.ok) {
          var idx = state.orders.findIndex(function (x) { return x.ref === res.order.ref; });
          if (idx !== -1) state.orders[idx] = res.order;
          savedToast(field);
          if (onSaved) onSaved();
        } else {
          order[field] = previous;
          fieldErrors[key] = (res && res.message) || 'Gagal menyimpan perubahan.';
          toast(esc(fieldErrors[key]), true);
        }
        render();
      })
      .withFailureHandler(function (err) {
        delete pending[key];
        order[field] = previous;
        fieldErrors[key] = String((err && err.message) || err || 'Gagal menyimpan perubahan.');
        toast(esc(fieldErrors[key]), true);
        render();
      })
      .updateOrder({ ref: ref, row: order.row, field: field, value: value });
  }

  /* The draft is cleared only once the server confirms the write — not on
     blur, and not just because a send button was tapped — so a WhatsApp
     round trip (or any other navigation away) can never silently drop an
     unsaved note. */
  function saveNotes(o) {
    var value = noteDrafts[o.ref] !== undefined ? noteDrafts[o.ref] : o.notes;
    if (value === o.notes) {
      delete noteDrafts[o.ref];
      saveNoteDrafts();
      renderTicket();
      return;
    }
    writeField(o.ref, 'notes', value, {
      rerender: false,
      onSaved: function () {
        delete noteDrafts[o.ref];
        saveNoteDrafts();
      }
    });
  }

  /* =====================================================================
     Boot: fetch the catalogue and the order list in parallel.
     ===================================================================== */
  function boot() {
    state.ordersError = null;
    state.catalogError = null;
    render();

    google.script.run
      .withSuccessHandler(function (catalog) { state.catalog = catalog; render(); })
      .withFailureHandler(function (err) {
        state.catalogError = String((err && err.message) || err);
        state.catalog = { stale: true, flowers: {}, pots: {}, additions: {},
                          packages: [], wraps: {}, minimumLeadDays: 2, bank: {} };
        render();
      })
      .getCatalog();

    google.script.run
      .withSuccessHandler(function (orders) { state.orders = orders; ordersFetchedAt = new Date(); render(); })
      .withFailureHandler(function (err) { state.ordersError = String((err && err.message) || err); render(); })
      .listOrders();
  }

  function reloadOrders() {
    elRefreshBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function (orders) {
        elRefreshBtn.disabled = false;
        state.orders = orders;
        ordersFetchedAt = new Date();
        render();
      })
      .withFailureHandler(function (err) {
        elRefreshBtn.disabled = false;
        toast(esc(String((err && err.message) || err)), true);
      })
      .listOrders();
  }

  /* SD-12 — Arsip search, debounced from elSearch's own input handler.
     append=false starts a fresh query (clears any previous results/cursor);
     append=true fetches the next page with the existing cursor, for "Muat
     lebih banyak". */
  var archiveSearchTimer = null;
  function triggerArchiveSearch(query, append) {
    var trimmed = String(query || '').trim();
    state.archive.query = trimmed;
    if (!append) {
      state.archive.results = [];
      state.archive.nextCursor = null;
    }
    state.archive.error = null;
    if (trimmed.length < ARCHIVE_MIN_QUERY_LENGTH_CLIENT) {
      state.archive.loading = false;
      render();
      return;
    }
    var cursor = append ? state.archive.nextCursor : 0;
    state.archive.loading = true;
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        /* A late response for a query she's since changed or a page she's
           already moved past must never clobber newer, already-rendered
           results — the same single-user request-ordering concern SD-03
           documents for writes. */
        if (state.archive.query !== trimmed) return;
        state.archive.loading = false;
        if (res && res.ok) {
          state.archive.results = append ? state.archive.results.concat(res.results) : res.results;
          state.archive.nextCursor = res.nextCursor;
        } else {
          state.archive.error = (res && res.message) || 'Gagal mencari arsip.';
        }
        render();
      })
      .withFailureHandler(function (err) {
        if (state.archive.query !== trimmed) return;
        state.archive.loading = false;
        state.archive.error = String((err && err.message) || err);
        render();
      })
      .searchArchive({ query: trimmed, cursor: cursor });
  }

  /* =====================================================================
     Events
     ===================================================================== */
  elRetryBtn.addEventListener('click', boot);
  elRefreshBtn.addEventListener('click', reloadOrders);
  elReloadCatalogBtn.addEventListener('click', function () {
    elReloadCatalogBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function (catalog) {
        elReloadCatalogBtn.disabled = false;
        state.catalog = catalog;
        render();
      })
      .withFailureHandler(function (err) {
        elReloadCatalogBtn.disabled = false;
        toast(esc(String((err && err.message) || err)), true);
      })
      .refreshCatalog();
  });

  document.getElementById('themeSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-theme-choice]');
    if (!b) return;
    themeChoice = b.dataset.themeChoice;
    try { localStorage.setItem(THEME_KEY, themeChoice); } catch (err) {}
    applyTheme(themeChoice);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && state.orders !== null) reloadOrders();
  });

  window.addEventListener('online', function () { if (state.orders !== null) render(); });
  window.addEventListener('offline', function () { if (state.orders !== null) render(); });

  elChips.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lane]');
    if (!b) return;
    state.lane = b.dataset.lane;
    /* SD-12 — switching into Arsip with a search term already typed (from
       browsing another lane) runs it immediately rather than leaving her
       looking at an empty list until she retypes something. */
    if (state.lane === 'archive' && state.search.trim().length >= ARCHIVE_MIN_QUERY_LENGTH_CLIENT && state.archive.query !== state.search.trim()) {
      triggerArchiveSearch(state.search, false);
      return;
    }
    render();
  });

  elPulse.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lane]');
    if (!b) return;
    state.lane = b.dataset.lane;
    render();
  });

  elSort.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-sort]');
    if (!b) return;
    state.sort = b.dataset.sort;
    render();
  });

  elSearch.addEventListener('input', function () {
    state.search = elSearch.value;
    if (state.lane === 'archive') {
      if (archiveSearchTimer) clearTimeout(archiveSearchTimer);
      var typed = elSearch.value;
      archiveSearchTimer = setTimeout(function () { triggerArchiveSearch(typed, false); }, 400);
      return;
    }
    render();
  });

  /* Master/detail on mobile is CSS state (body.detail), so the phone's own
     back gesture would otherwise leave the Desk entirely rather than close
     the ticket. Push a history entry when one opens and let popstate close
     it, so the gesture and the in-page back button share one path. The Desk
     runs inside the Apps Script /exec sandbox iframe, where history
     manipulation can be restricted — if pushState throws, historyPushed
     stays false and the in-page button falls back to closing the view
     directly instead of touching history at all. */
  var historyPushed = false;

  function closeDetail() {
    document.body.classList.remove('detail');
  }

  window.addEventListener('popstate', function () {
    historyPushed = false;
    closeDetail();
  });

  elQueue.addEventListener('click', function (e) {
    var cross = e.target.closest('[data-crosslane]');
    if (cross) {
      state.lane = cross.dataset.crosslane;
      render();
      return;
    }

    if (e.target.closest('[data-loadmorearchive]')) {
      triggerArchiveSearch(state.archive.query, true);
      return;
    }

    var b = e.target.closest('button[data-ref]');
    if (!b) return;
    state.selected = b.dataset.ref;
    confirming = false;
    document.body.classList.add('detail');
    /* body.detail only changes anything below the 900px master/detail
       breakpoint — above it, pushing history on every card tap left a Back
       press that visibly did nothing. See P5-3 in STUDIO-DESK-UX-REVIEW.md. */
    if (window.matchMedia('(max-width: 899px)').matches) {
      try {
        history.pushState({ desk: 'detail', ref: state.selected }, '');
        historyPushed = true;
      } catch (e) { historyPushed = false; }
    }
    renderQueue();
    renderTicket();
    elTicket.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });

  elTicket.addEventListener('click', function (e) {
    var o = findOrder(state.selected);
    if (!o) return;
    var p = per(o.ref);

    if (e.target.closest('[data-back]')) {
      if (historyPushed) { historyPushed = false; history.back(); } else { closeDetail(); }
      return;
    }

    /* SD-06 — "Periksa pembayaran"/"Periksa & kemas" aren't a single
       mutating action (verifying a bank transfer or finishing the packing
       checklist both need her to actually look at something), so the
       primary action here just brings the relevant section into view
       instead of performing a click for her. */
    var focusBlock = e.target.closest('[data-focusblock]');
    if (focusBlock) {
      var focusTarget = elTicket.querySelector('[data-fk="' + focusBlock.dataset.focusblock + '"]');
      if (focusTarget) {
        focusTarget.focus();
        focusTarget.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      return;
    }

    var tick = e.target.closest('[data-tick]');
    if (tick) {
      p.ticks = p.ticks || {};
      var tickOn = !p.ticks[tick.dataset.tick];
      p.ticks[tick.dataset.tick] = tickOn;
      savePer();
      tick.setAttribute('aria-pressed', String(tickOn));
      updateAdvanceButtonState();
      if (tick.dataset.tick === 'card') syncChecklistItem(o.ref, 'gate:card-read', 'v1', tickOn);
      return;
    }

    var comp = e.target.closest('[data-comp]');
    if (comp) {
      p.comps = p.comps || {};
      var compOn = !p.comps[comp.dataset.comp];
      p.comps[comp.dataset.comp] = compOn;
      savePer();
      comp.setAttribute('aria-pressed', String(compOn));
      updateCompCount();
      syncChecklistItem(o.ref, comp.dataset.contentkey, comp.dataset.contentkey, compOn);
      return;
    }

    var packing = e.target.closest('[data-packing]');
    if (packing) {
      p.packing = p.packing || {};
      var packingOn = !p.packing[packing.dataset.packing];
      p.packing[packing.dataset.packing] = packingOn;
      savePer();
      packing.setAttribute('aria-pressed', String(packingOn));
      updatePhaseAdvanceButtonState();
      syncChecklistItem(o.ref, 'packing:' + packing.dataset.packing, 'v1', packingOn);
      return;
    }

    if (e.target.closest('[data-markreviewed]')) { markReviewedAction(o); return; }

    if (e.target.closest('[data-openledgerform]')) {
      recordingPayment = { type: 'receipt', amount: '' };
      paymentIdempotencyKey = generateIdempotencyKey();
      renderTicket();
      return;
    }
    var ledgerTypeBtn = e.target.closest('[data-ledgertype]');
    if (ledgerTypeBtn && recordingPayment) {
      var amountInput = document.getElementById('ledgeramount');
      if (amountInput) recordingPayment.amount = amountInput.value;
      recordingPayment.type = ledgerTypeBtn.dataset.ledgertype;
      renderTicket();
      return;
    }
    if (e.target.closest('[data-cancelledgerform]')) {
      recordingPayment = false;
      paymentIdempotencyKey = null;
      renderTicket();
      return;
    }
    if (e.target.closest('[data-submitledger]')) { submitLedgerRecord(o); return; }

    var payBtn = e.target.closest('[data-pay]');
    if (payBtn) {
      confirming = false;
      refocus = 'paymentHeading';
      writeField(o.ref, 'payment', payBtn.dataset.pay);
      return;
    }

    var planBtn = e.target.closest('[data-plan]');
    if (planBtn) {
      refocus = 'paymentHeading';
      writeField(o.ref, 'paymentPlan', planBtn.dataset.plan);
      return;
    }

    var askPaid = e.target.closest('[data-askpaid]');
    if (askPaid) { confirming = askPaid.dataset.askpaid; refocus = 'confirm-primary'; renderTicket(); return; }
    if (e.target.closest('[data-askcancel]')) { confirming = 'cancel'; refocus = 'confirm-primary'; renderTicket(); return; }
    if (e.target.closest('[data-cancelconfirm]')) { confirming = false; refocus = 'paymentHeading'; renderTicket(); return; }

    if (e.target.closest('[data-advance]')) {
      var i = PHASES.findIndex(function (x) { return x.key === o.phase; });
      if (PHASES[i + 1] && PHASES[i + 1].key === 'Shipped' && o.payment !== 'Paid') {
        toast('Pelunasan harus diterima sebelum pesanan dikirim.', true);
        return;
      }
      if (PHASES[i + 1]) {
        var becomingDelivered = PHASES[i + 1].key === 'Delivered';
        refocus = 'phaseHeading';
        writeField(o.ref, 'phase', PHASES[i + 1].key, becomingDelivered ? {
          onSaved: function () { toast('Pesanan selesai. Dipindahkan ke daftar Selesai.'); }
        } : undefined);
      }
      return;
    }

    if (e.target.closest('[data-retreat]')) {
      var j = PHASES.findIndex(function (x) { return x.key === o.phase; });
      if (j > 0) { refocus = 'phaseHeading'; writeField(o.ref, 'phase', PHASES[j - 1].key); }
      return;
    }

    var copyCard = e.target.closest('[data-copycard]');
    if (copyCard && o.card) {
      copyText(o.card.text + '\n— ' + o.card.from);
      copyCard.textContent = 'Tersalin';
      /* Revert after a couple of seconds, matching the toast's own timing —
         otherwise the button can keep reading "Tersalin" long after she's
         scrolled past this order. See P5-4 in STUDIO-DESK-UX-REVIEW.md. */
      setTimeout(function () {
        if (document.body.contains(copyCard)) copyCard.textContent = 'Salin teks kartu';
      }, 2600);
      return;
    }

    if (e.target.closest('[data-sendpayment]')) {
      if (billed(o) === null) return;
      openWhatsApp(o, paymentRequestMessage(o, e.target.closest('[data-sendpayment]').dataset.sendpayment));
      return;
    }

    if (e.target.closest('[data-sendpaid]')) {
      openWhatsApp(o, paymentConfirmedMessage(o));
      return;
    }

    if (e.target.closest('[data-sendphase]')) {
      var msg = phaseMessage(o);
      if (msg) openWhatsApp(o, msg);
      return;
    }

    if (e.target.closest('[data-retrynotes]')) {
      refocus = 'notesHeading';
      saveNotes(o);
      return;
    }

    if (e.target.closest('[data-openscheduleform]')) {
      var sch0 = o.schedule || {};
      schedulingForm = { agreedDate: sch0.agreedDate || '', agreedTime: sch0.agreedTime || '', productionDeadline: sch0.productionDeadline || '', rescheduleReason: '' };
      renderTicket();
      return;
    }
    if (e.target.closest('[data-cancelscheduleform]')) { schedulingForm = false; renderTicket(); return; }
    if (e.target.closest('[data-submitschedule]')) { submitScheduleForm(o); return; }

    if (e.target.closest('[data-opendeliveryform]')) {
      var d0 = o.delivery || {};
      deliveryForm = {
        recipientName: d0.recipientName || '', recipientContact: d0.recipientContact || '',
        destinationDetail: d0.destinationDetail || '', courier: d0.courier || '', tracking: d0.tracking || ''
      };
      renderTicket();
      return;
    }
    if (e.target.closest('[data-canceldeliveryform]')) { deliveryForm = false; renderTicket(); return; }
    if (e.target.closest('[data-submitdelivery]')) { submitDeliveryForm(o); return; }
    if (e.target.closest('[data-markhandoff]')) { markHandoffAction(o); return; }
    if (e.target.closest('[data-markdeliverycomplete]')) { markDeliveryCompleteAction(o); return; }

    if (e.target.closest('[data-openblockerform]')) { blockerForm = { reason: '', note: '' }; renderTicket(); return; }
    if (e.target.closest('[data-cancelblockerform]')) { blockerForm = false; renderTicket(); return; }
    var blockerReasonBtn = e.target.closest('[data-blockerreason]');
    if (blockerReasonBtn && blockerForm) {
      var noteInput = document.getElementById('blockerNote');
      if (noteInput) blockerForm.note = noteInput.value;
      blockerForm.reason = blockerReasonBtn.dataset.blockerreason;
      renderTicket();
      return;
    }
    if (e.target.closest('[data-submitblocker]')) { submitBlockerForm(o); return; }
    if (e.target.closest('[data-resolveblocker]')) { resolveBlockerAction(o); return; }

    var openComp = e.target.closest('[data-opencomposition]');
    if (openComp) {
      editingComposition = openComp.dataset.opencomposition;
      var pkgIdxForOpen = Number(openComp.dataset.packageindex);
      var pkgSpec = (state.catalog.packages || [])[pkgIdxForOpen];
      compositionRequiredStems = pkgSpec ? pkgSpec.stems : null;
      var existingComp = compositionFor(o.ref, editingComposition);
      compositionDraft = { stems: {}, additions: {} };
      if (existingComp) {
        (existingComp.stems || []).forEach(function (s) { compositionDraft.stems[s.key] = s.qty; });
        (existingComp.additions || []).forEach(function (a) { compositionDraft.additions[a.key] = a.qty; });
      }
      renderTicket();
      return;
    }
    if (e.target.closest('[data-cancelcomposition]')) {
      editingComposition = null;
      compositionDraft = null;
      renderTicket();
      return;
    }
    var submitComp = e.target.closest('[data-submitcomposition]');
    if (submitComp) {
      submitCompositionForm(o, submitComp.dataset.submitcomposition, Number(submitComp.dataset.packageindex));
      return;
    }
  });

  elTicket.addEventListener('change', function (e) {
    var o = findOrder(state.selected);
    if (!o) return;

    if (e.target.classList.contains('notes')) {
      saveNotes(o);
      return;
    }
    if (e.target.type !== 'number' || e.target.id.indexOf('ongkir-') !== 0) return;
    var raw = e.target.value.trim();
    var value = raw === '' ? '' : Math.max(0, Number(raw));
    writeField(o.ref, 'shipping', value, { rerender: false });
  });

  elTicket.addEventListener('input', function (e) {
    if (e.target.classList.contains('notes')) {
      noteDrafts[state.selected] = e.target.value;
      saveNoteDrafts();
      return;
    }
    if (e.target.matches('.ongkir .amtwrap input')) {
      updateOngkirEcho(e.target.value);
      return;
    }
    var stemInput = e.target.closest('[data-stemkey]');
    if (stemInput && compositionDraft) {
      compositionDraft.stems[stemInput.dataset.stemkey] = stemInput.value;
      updateCompositionTotal();
      return;
    }
    var additionInput = e.target.closest('[data-additionkey]');
    if (additionInput && compositionDraft) {
      compositionDraft.additions[additionInput.dataset.additionkey] = additionInput.value;
      return;
    }
  });

  /* Live "= Rp 45.000" echo and total, updated as she types — display only,
     never touches the input's own value or state.orders. See P3-4 in
     STUDIO-DESK-UX-REVIEW.md. */
  function updateOngkirEcho(raw) {
    var n = raw === '' ? NaN : Number(raw);
    var valid = raw !== '' && isFinite(n) && n >= 0;
    var echo = document.getElementById('ongkirEcho');
    if (echo) echo.textContent = valid ? '= ' + rupiah(n) : '';
    var o = findOrder(state.selected);
    var bigEl = elTicket.querySelector('.amount .big');
    if (o && bigEl) bigEl.textContent = valid ? rupiah(o.verified + n) : '—';
  }

  function copyText(text) {
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
  }

  /* Opens the buyer's WhatsApp chat with the message already typed in,
     ready to send — never sent automatically, she still taps send herself.
     A new top-level window, not the Apps Script iframe (wa.me refuses to
     render framed). */
  function openWhatsApp(o, message) {
    var digits = String(o.wa || '').replace(/[^\d]/g, '');
    var url = 'https://wa.me/' + digits + '?text=' + encodeURIComponent(message);
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  function paymentRequestMessage(o, kind) {
    var amount = billed(o);
    var bank = state.catalog.bank || {};
    if (kind === 'deposit') {
      return 'Halo ' + firstName(o.buyer) + ', terima kasih untuk pesanannya.\n' +
        'Nomor pesanan: ' + o.ref + '\nTotal pesanan: ' + rupiah(amount) + '\n' +
        'DP 50%: ' + rupiah(depositAmount(o)) + '\nSisa pelunasan: ' + rupiah(balanceAmount(o)) + '\n' +
        'Transfer ke ' + bank.bank + ' ' + bank.number + ' a.n. ' + bank.holder + '\n' +
        'Kalau sudah, balas chat ini ya. Produksi dimulai setelah DP kami konfirmasi.';
    }
    if (kind === 'balance') {
      return 'Halo ' + firstName(o.buyer) + ', pesananmu (' + o.ref + ') sudah siap dikirim.\n' +
        'Total pesanan: ' + rupiah(amount) + '\nDP sudah diterima: ' + rupiah(depositAmount(o)) + '\n' +
        'Sisa pelunasan: ' + rupiah(balanceAmount(o)) + '\n' +
        'Transfer ke ' + bank.bank + ' ' + bank.number + ' a.n. ' + bank.holder + '\n' +
        'Setelah pelunasan kami konfirmasi, pesanan siap dikirim. Terima kasih!';
    }
    return 'Halo ' + firstName(o.buyer) + ', terima kasih untuk pesanannya.\n' +
      'Nomor pesanan: ' + o.ref + '\n' +
      'Total: ' + rupiah(amount) + '\n' +
      'Transfer ke ' + bank.bank + ' ' + bank.number + ' a.n. ' + bank.holder + '\n' +
      'Kalau sudah, balas chat ini ya — nanti kami cek dan langsung dikerjakan untuk ' + fmtDate(o.date) + '.';
  }

  function paymentConfirmedMessage(o) {
    if (usesDeposit(o)) {
      return 'Halo ' + firstName(o.buyer) + ', pelunasan pesanan ' + o.ref + ' sudah kami terima. ' +
        'Status pembayaran sekarang lunas. Terima kasih!';
    }
    return 'Halo ' + firstName(o.buyer) + ', pembayaran untuk pesanan ' + o.ref + ' sudah kami terima. ' +
      'Terima kasih! Pesananmu akan segera kami mulai buatkan.';
  }

  /* One message per work phase, shown once she's already advanced into it —
     "Kirim pesan" sits next to Kembali for every phase past Belum mulai. */
  function phaseMessage(o) {
    var name = firstName(o.buyer);
    if (o.phase === 'Assembly and packing') {
      return 'Halo ' + name + ', pesananmu (' + o.ref + ') sedang kami rangkai dan kemas. Kami kabari lagi begitu siap ya.';
    }
    if (o.phase === 'Ready for dispatch') {
      if (o.locationType === 'bali') {
        return o.method === 'self_pickup'
          ? 'Halo ' + name + ', pesananmu (' + o.ref + ') sudah siap diambil di studio kapan saja.'
          : 'Halo ' + name + ', pesananmu (' + o.ref + ') sudah siap. Kamu bisa pesan Gojek/Grab kapan saja untuk mengambilnya.';
      }
      return 'Halo ' + name + ', pesananmu (' + o.ref + ') sudah siap dan akan segera kami kirim.';
    }
    if (o.phase === 'Shipped') {
      return 'Halo ' + name + ', pesananmu (' + o.ref + ') sudah dikirim dan sedang dalam perjalanan menujumu.';
    }
    if (o.phase === 'Delivered') {
      return 'Halo ' + name + ', terima kasih ya! Semoga pesananmu (' + o.ref + ') sudah sampai dengan baik.';
    }
    return null;
  }

  boot();
</script>
