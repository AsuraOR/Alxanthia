<title>Alxanthia Studio Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  /* ---------------------------------------------------------------------
     Alxanthia Studio Desk — maker-facing order interface.
     Palette comes from the studio's own materials: the four wrap swatches
     in site-content.js (kraft / cream / sage / blush). Pine is the chrome
     accent; attention states use kraft-amber and madder red so "done" can
     stay quiet ink instead of competing green.
     --------------------------------------------------------------------- */
  :root {
    --ground: #F2F4EF;
    --surface: #FCFCF9;
    --surface-2: #EDEFE8;
    --ink: #1B201B;
    --ink-2: #4E564D;
    --muted: #5F6A5D; /* darkened from #737B70 for AA contrast on --surface/-2 and --ground — see P4-2 in STUDIO-DESK-UX-REVIEW.md */
    --rule: #D9DDD3;
    --rule-strong: #C2C8BA;
    --pine: #33503F;
    --pine-soft: #E2EAE1;
    --on-accent: #FCFCF9;
    --amber: #8E6318;
    --amber-soft: #F6ECD8;
    --madder: #972E34;
    --madder-soft: #F7E3E2;
    --blush: #C9A4A8;
    --shadow: 0 1px 2px rgba(27, 32, 27, .06), 0 8px 24px -16px rgba(27, 32, 27, .28);
    --r: 10px;
    --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141711;
      --surface: #1C201B;
      --surface-2: #242923;
      --ink: #EDEFE7;
      --ink-2: #C3C9BD;
      --muted: #929A8C;
      --rule: #2E332C;
      --rule-strong: #414739;
      --pine: #93BC9D;
      --pine-soft: #23301F;
      --on-accent: #141711;
      --amber: #DFA94F;
      --amber-soft: #332714;
      --madder: #E58E91;
      --madder-soft: #341D1D;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -18px rgba(0, 0, 0, .8);
    }
  }

  :root[data-theme="dark"] {
    --ground: #141711;
    --surface: #1C201B;
    --surface-2: #242923;
    --ink: #EDEFE7;
    --ink-2: #C3C9BD;
    --muted: #929A8C;
    --rule: #2E332C;
    --rule-strong: #414739;
    --pine: #93BC9D;
    --pine-soft: #23301F;
    --on-accent: #141711;
    --amber: #DFA94F;
    --amber-soft: #332714;
    --madder: #E58E91;
    --madder-soft: #341D1D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -18px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 1180px; margin: 0 auto; padding: 0 16px 72px; }

  /* ---------- top bar ---------- */
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 16px;
    padding-block: 22px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .bar h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .bar h1 small {
    display: block;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .bar .today {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-2);
    margin-inline-start: auto;
  }
  .bar .orders-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .bar .refresh {
    font: 600 12px/1 var(--sans);
    padding: 8px 11px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    border-radius: 7px;
    border: 1px solid var(--rule-strong);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
  }
  .bar .refresh[disabled] { opacity: .5; cursor: not-allowed; }

  /* ---------- load strip ---------- */
  .pulse {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 26px;
    padding-block: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .pulse-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font: inherit;
    background: none;
    border: 0;
    border-radius: 6px;
    padding: 2px 4px;
    margin: -2px -4px;
    color: inherit;
    cursor: pointer;
  }
  .pulse-item[aria-pressed="true"] { background: var(--surface-2); }
  .pulse-item.static { cursor: default; }
  .pulse b {
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .pulse span {
    font-size: 11.5px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .pulse .late b { color: var(--madder); }
  .pulse .pay b { color: var(--amber); }

  /* ---------- lane chips ---------- */
  .chips {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-block: 14px;
    scrollbar-width: none;
    mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    position: relative;
    flex: 0 0 auto;
    font: 500 13px/1 var(--sans);
    padding: 9px 13px;
    border-radius: 999px;
    border: 1px solid var(--rule-strong);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
  }
  /* The pill itself stays visually compact so the row doesn't get too tall
     to scan, but the actual tap target grows to the 44px floor via an
     invisible overlay — see P4-1 in STUDIO-DESK-UX-REVIEW.md. */
  .chips button::before { content: ''; position: absolute; inset: -6px; }
  .chips button .n {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    margin-inline-start: 5px;
  }
  .chips button[aria-pressed="true"] {
    background: var(--pine);
    border-color: var(--pine);
    color: var(--on-accent);
  }
  .chips button[aria-pressed="true"] .n { color: inherit; opacity: .7; }

  /* ---------- two-pane layout ---------- */
  .panes { display: grid; gap: 20px; align-items: start; }
  @media (min-width: 900px) {
    .panes { grid-template-columns: 360px minmax(0, 1fr); }
  }

  /* ---------- search and sort ---------- */
  .search { margin-bottom: 10px; }
  .search label {
    display: block;
    margin-bottom: 6px;
    font: 600 10.5px/1 var(--sans);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .search input {
    width: 100%;
    font: 500 14px/1.2 var(--sans);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 7px;
    padding: 10px 12px;
  }
  .search input::placeholder { color: var(--muted); }
  .sort {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .k {
    font: 600 10.5px/1 var(--sans);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 8px;
  }
  .sort .k { display: inline; margin-bottom: 0; }
  .seg { display: flex; border: 1px solid var(--rule-strong); border-radius: 7px; overflow: visible; width: max-content; }
  .seg button {
    position: relative;
    font: 500 12.5px/1 var(--sans);
    padding: 8px 11px;
    border: 0;
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
  }
  .seg button:first-child { border-start-start-radius: 7px; border-end-start-radius: 7px; }
  .seg button:last-child { border-start-end-radius: 7px; border-end-end-radius: 7px; }
  /* overflow:hidden on .seg would clip the extended tap target below — see
     the border-radius rules above, which do the corner-rounding job that
     overflow:hidden used to. */
  .seg button::before { content: ''; position: absolute; top: -7px; bottom: -7px; left: 0; right: 0; }
  .seg button[disabled] { opacity: .55; cursor: not-allowed; }
  .seg button + button { border-inline-start: 1px solid var(--rule-strong); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }

  /* ---------- queue ---------- */
  .queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .queue-empty {
    border: 1px dashed var(--rule-strong);
    border-radius: var(--r);
    padding: 26px 18px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }
  .queue-empty p { margin: 0 0 10px; }
  .queue-group {
    padding: 8px 2px 0;
    font: 600 10.5px/1 var(--sans);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .queue-group:first-child { padding-top: 0; }
  .card {
    width: 100%;
    display: grid;
    grid-template-columns: 4px minmax(0, 1fr);
    gap: 0 12px;
    text-align: start;
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    padding: 0;
    overflow: hidden;
    cursor: pointer;
  }
  .card:hover { border-color: var(--rule-strong); }
  .card[aria-current="true"] { border-color: var(--pine); box-shadow: var(--shadow); }
  .card .stripe { background: var(--rule-strong); }
  .card.is-late .stripe { background: var(--madder); }
  .card.is-today .stripe { background: var(--amber); }
  .card.is-working .stripe { background: var(--pine); }
  .card .body { padding: 12px 14px 13px 2px; min-width: 0; }
  .card .row1 { display: flex; align-items: baseline; gap: 8px; }
  .card .ref {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: -0.01em;
  }
  .card .due {
    margin-inline-start: auto;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .card.is-late .due { color: var(--madder); }
  .card.is-today .due { color: var(--amber); }
  .card .who { font-family: var(--serif); font-size: 17.5px; line-height: 1.25; margin: 3px 0 1px; }
  .card .what {
    font-size: 13px;
    color: var(--ink-2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .what .swatch { vertical-align: text-top; margin-inline-end: 5px; }
  .card .in {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .card .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: 600 11.5px/1 var(--sans);
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 5px 7px;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--ink-2);
    white-space: nowrap;
  }
  .tag.warn { background: var(--amber-soft); color: var(--amber); }
  .tag.stop { background: var(--madder-soft); color: var(--madder); }
  .tag.go { background: var(--pine-soft); color: var(--pine); }
  .tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .swatch {
    width: 11px; height: 11px; border-radius: 2px;
    border: 1px solid rgba(27, 32, 27, .25);
    flex: 0 0 auto;
  }

  /* ---------- ticket ---------- */
  .ticket {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .ticket .back {
    display: none;
    font: 600 12px/1 var(--sans);
    letter-spacing: .04em;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--rule);
    color: var(--pine);
    padding: 13px 16px;
    width: 100%;
    text-align: start;
    cursor: pointer;
  }
  .ticket-head {
    padding: 16px 18px 15px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    align-items: flex-start;
  }
  .ticket-head .id { min-width: 0; }
  .ticket-head .ref { font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .ticket-head h2 {
    font-family: var(--serif);
    font-size: 23px;
    font-weight: 600;
    margin: 2px 0 6px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .ticket-head .wa {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 1px solid var(--rule-strong);
  }
  .ticket-head .in { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  .ticket-head .when { margin-inline-start: auto; text-align: end; }
  .ticket-head .when .d {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: block;
  }
  .ticket-head .when .rel {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ticket-head.is-late .when .d, .ticket-head.is-late .when .rel { color: var(--madder); }
  .ticket-head.is-today .when .d, .ticket-head.is-today .when .rel { color: var(--amber); }

  .block { padding: 17px 18px; border-bottom: 1px solid var(--rule); }
  .block:last-child { border-bottom: 0; }
  .block > h3 {
    margin: 0 0 12px;
    font: 600 10.5px/1 var(--sans);
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .block > h3 .count {
    margin-inline-start: auto;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    text-transform: none;
  }
  .block.pay-open { background: var(--amber-soft); }

  /* ---------- payment ---------- */
  .amount { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .amount .big {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .amount .lbl { font-size: 12px; color: var(--ink-2); }
  .breakdown {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-2);
    margin-top: 5px;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 12px;
  }
  .ongkir { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 13px; }
  .ongkir label { font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .ongkir input {
    font: 500 15px/1 var(--mono);
    width: 132px;
    padding: 10px 11px;
    border: 1px solid var(--rule-strong);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
  }
  .ongkir input[disabled] { opacity: .5; }
  .ongkir .hint { font-size: 12px; color: var(--ink-2); flex: 1 1 160px; }
  .ongkir .amtwrap { position: relative; display: inline-flex; align-items: center; }
  .ongkir .amtwrap .prefix {
    position: absolute;
    left: 11px;
    font: 500 15px/1 var(--mono);
    color: var(--ink-2);
    pointer-events: none;
  }
  .ongkir .amtwrap input { padding-inline-start: 32px; }
  .paystate { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .paystate .step {
    font: 600 11px/1 var(--sans);
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 7px 9px;
    border-radius: 4px;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    color: var(--muted);
  }
  .paystate .step.on { background: var(--pine); border-color: var(--pine); color: var(--on-accent); }
  .paystate .step.past { border-color: var(--pine); color: var(--pine); }
  .actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; align-items: center; }

  .btn {
    font: 600 13.5px/1 var(--sans);
    padding: 12px 17px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    border: 1px solid var(--pine);
    background: var(--pine);
    color: var(--on-accent);
    cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--rule-strong); }
  .btn.small { font-size: 12px; padding: 9px 12px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .why { font-size: 12.5px; color: var(--ink-2); flex: 1 1 180px; }
  .why.err { color: var(--madder); }

  .confirm {
    margin-top: 13px;
    border: 1px solid var(--pine);
    border-radius: 7px;
    padding: 13px 14px;
    background: var(--surface);
  }
  .confirm p { margin: 0 0 4px; font-size: 14px; }
  .confirm .rule { font-size: 12.5px; color: var(--madder); }
  .confirm .actions { margin-top: 11px; }

  .paid-line {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 14px;
  }
  .paid-line .ok { color: var(--pine); font-weight: 600; }
  .paid-line .cancelled { color: var(--madder); font-weight: 600; }
  .paid-line .amt { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .paid-line .st { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

  /* ---------- checks ---------- */
  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .checks li {
    display: grid;
    grid-template-columns: 17px minmax(0, 1fr);
    gap: 9px;
    align-items: start;
    padding: 6px 0;
    font-size: 13.5px;
  }
  .checks .mark { font-family: var(--mono); font-size: 13px; font-weight: 600; line-height: 1.35; text-align: center; }
  .checks .pass .mark { color: var(--pine); }
  .checks .fail .mark { color: var(--madder); }
  .checks .fail, .checks .fail .sub { color: var(--madder); }
  .checks .sub { display: block; font-size: 12px; color: var(--muted); }

  .tick {
    display: grid;
    grid-template-columns: 17px minmax(0, 1fr);
    gap: 9px;
    align-items: center;
    width: 100%;
    min-height: 44px;
    text-align: start;
    background: none;
    border: 0;
    padding: 13px 0;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    cursor: pointer;
  }
  .box {
    width: 16px; height: 16px;
    border: 1.5px solid var(--rule-strong);
    border-radius: 3px;
    margin-top: 2px;
    display: grid;
    place-items: center;
    font: 700 11px/1 var(--sans);
    color: transparent;
  }
  [aria-pressed="true"] > .box { background: var(--pine); border-color: var(--pine); color: var(--on-accent); }
  .tick[aria-pressed="true"] .label { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

  /* ---------- make list ---------- */
  .make { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .make > li { border-top: 1px solid var(--rule); }
  .make > li:first-child { border-top: 0; }
  .comp {
    display: grid;
    grid-template-columns: 17px 40px minmax(0, 1fr);
    gap: 11px;
    align-items: start;
    width: 100%;
    min-height: 44px;
    text-align: start;
    background: none;
    border: 0;
    padding: 13px 0;
    font: inherit;
    color: var(--ink);
    cursor: pointer;
  }
  .comp .qty {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .comp .name { display: block; font-size: 15.5px; line-height: 1.3; }
  .comp .spec { display: block; font-size: 12.5px; color: var(--ink-2); font-family: var(--mono); margin-top: 3px; }
  .comp .spec .k { color: var(--muted); }
  .comp[aria-pressed="true"] .name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

  /* ---------- finishing ---------- */
  .pair .k {
    font: 600 10.5px/1 var(--sans);
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 5px;
  }

<script>
  'use strict';

  /* Work Phase — English keys are what the sheet stores; Indonesian is what
     she reads. All five (six with Cancelled, excluded from the queue by the
     server) are hers to move. */
  var PHASES = [
    { key: 'Not started',          label: 'Belum mulai' },
    { key: 'Assembly and packing', label: 'Dirangkai dan dikemas' },
    { key: 'Ready for dispatch',   label: 'Siap dikirim' },
    { key: 'Shipped',              label: 'Dikirim' },
    { key: 'Delivered',            label: 'Selesai' }
  ];

  /* Payment Status — manual bank transfer, no payment gateway. */
  var PAYMENTS = [
    { key: 'Unpaid',            label: 'Belum bayar' },
    { key: 'Checking transfer', label: 'Perlu dicek' },
    { key: 'Checking deposit',  label: 'Periksa DP' },
    { key: 'Deposit paid',      label: 'DP diterima' },
    { key: 'Checking balance',  label: 'Periksa pelunasan' },
    { key: 'Paid',              label: 'Lunas' },
    { key: 'Cancelled',         label: 'Dibatalkan' }
  ];

  /* =====================================================================
     State. Orders and the catalogue arrive from the server; only the
     build-list ticks and the card-read tick are kept locally, per device,
     keyed by order reference — bench scratch state, not a business record.
     ===================================================================== */
  var state = {
    lane: 'all',
    sort: 'due',
    search: '',
    selected: null,
    orders: null,
    catalog: null,
    ordersError: null,
    catalogError: null,
    per: {},
    checklist: {}, // ref -> array of server checklist rows (SD-02), loaded per ticket
    activity: {} // ref -> array of server activity rows (SD-03), loaded per ticket
  };
  var confirming = false;
  var pending = {}; // "ref|field" -> true while a write is in flight
  var fieldErrors = {}; // "ref|field" -> Indonesian error message
  var noteDrafts = {}; // ref -> unsaved textarea value, persisted so a trip to WhatsApp can't lose it
  var refocus = null;
  var extrasLoadedFor = null; // ref whose Desk Ops extras (checklist/activity) have been fetched
  var recordingPayment = false; // false | { type: 'receipt'|'refund'|'correction' } — the inline Catat pembayaran form
  var paymentIdempotencyKey = null; // minted once per open attempt, reused across retries of the same submit

  var PER_KEY = 'alxanthia-desk-per-v1';
  try {
    var savedPer = JSON.parse(localStorage.getItem(PER_KEY) || 'null');
    if (savedPer && typeof savedPer === 'object') state.per = savedPer;
  } catch (e) { /* private window or blocked storage — defaults are fine */ }

  function savePer() {
    try { localStorage.setItem(PER_KEY, JSON.stringify(state.per)); } catch (e) {}
  }

  var NOTE_DRAFTS_KEY = 'alxanthia-desk-notedrafts-v1';
  try {
    var savedDrafts = JSON.parse(localStorage.getItem(NOTE_DRAFTS_KEY) || 'null');
    if (savedDrafts && typeof savedDrafts === 'object') noteDrafts = savedDrafts;
  } catch (e) { /* private window or blocked storage — defaults are fine */ }

  function saveNoteDrafts() {
    try { localStorage.setItem(NOTE_DRAFTS_KEY, JSON.stringify(noteDrafts)); } catch (e) {}
  }

  /* The newest Submitted At she has actually looked at, per device — spotting
     an overnight order is the first job of the day and today the only cue is
     a small timestamp on every card. See P2-3 in STUDIO-DESK-UX-REVIEW.md. */
  var LAST_SEEN_KEY = 'alxanthia-desk-lastseen-v1';
  var lastSeenAt = '';
  try { lastSeenAt = localStorage.getItem(LAST_SEEN_KEY) || ''; } catch (e) {}

  function markSeen(o) {
    if (o && o.submitted && o.submitted > lastSeenAt) {
      lastSeenAt = o.submitted;
      try { localStorage.setItem(LAST_SEEN_KEY, lastSeenAt); } catch (e) {}
    }
  }

  /* SD-02 — the final packing checklist, distinct from the per-item make
     list above it. Required (client-side; ground rule 5 — a convenience,
     not the real guard) before advancing out of Dirangkai dan dikemas. */
  var PACKING_ITEMS = [
    { key: 'items', label: 'Jumlah dan jenis barang sudah sesuai pesanan' },
    { key: 'wrap', label: 'Pembungkus/kemasan sudah benar' },
    { key: 'card', label: 'Kartu ucapan sudah dicek', cardOnly: true },
    { key: 'secure', label: 'Paket sudah dikemas rapat dan aman' }
  ];

  function packingItemsFor(o) {
    return PACKING_ITEMS.filter(function (item) { return !item.cardOnly || o.card; });
  }

  function packingComplete(o) {
    var packingState = per(o.ref).packing || {};
    return packingItemsFor(o).every(function (item) { return !!packingState[item.key]; });
  }

  /* Server Desk Checklist rows are the saved truth; local per(ref).comps/
     ticks/packing is a cache that renders instantly and gets corrected the
     moment the server's own state is known — see SD-02 in
     STUDIO-DESK-ADDITIONAL-IMPLEMENTATION.md. Reordering items keeps their
     checks (matched by content, not position); editing an item's content
     drops only that item's own check. */
  function applyServerChecklist(ref, items, rows) {
    var contentKeys = itemChecklistKeys(items);
    var byKey = {};
    rows.forEach(function (r) { byKey[r.key] = r; });
    var p = per(ref);
    p.comps = p.comps || {};
    p.ticks = p.ticks || {};
    p.packing = p.packing || {};
    contentKeys.forEach(function (ck, i) {
      var row = byKey[ck];
      if (row) p.comps['i' + i] = row.completed;
    });
    var gateRow = byKey['gate:card-read'];
    if (gateRow) p.ticks.card = gateRow.completed;
    PACKING_ITEMS.forEach(function (item) {
      var row = byKey['packing:' + item.key];
      if (row) p.packing[item.key] = row.completed;
    });
    savePer();
  }

  /* Fires once per ticket open, not on every re-render — renderTicket()
     calls this and it no-ops if extras for this ref are already loaded or
     loading. */
  function loadTicketExtras(o) {
    if (extrasLoadedFor === o.ref) return;
    extrasLoadedFor = o.ref;
    google.script.run
      .withSuccessHandler(function (rows) {
        applyServerChecklist(o.ref, o.items, rows || []);
        if (state.selected === o.ref) renderTicket();
      })
      .withFailureHandler(function () { /* keep the local cache; try again next open */ })
      .getChecklist(o.ref);
    google.script.run
      .withSuccessHandler(function (rows) {
        state.activity[o.ref] = rows || [];
        if (state.selected === o.ref) renderTicket();
      })
      .withFailureHandler(function () {})
      .getActivity(o.ref);
  }

  /* Pushes one checklist toggle to the server in the background — the DOM
     is already updated optimistically by the caller (P1-4 in-place
     toggle); a failure here only shows a toast, it never reverts the tap. */
  function syncChecklistItem(ref, key, contentVersion, completed) {
    google.script.run
      .withSuccessHandler(function () {})
      .withFailureHandler(function (err) {
        toast('Centang belum tersimpan ke server: ' + esc(String((err && err.message) || err)), true);
      })
      .setChecklistItem({ ref: ref, key: key, contentVersion: contentVersion, completed: completed });
  }

  /* SD-04 — idempotent on the server; a double tap or a retry just returns
     the existing reviewed record. */
  function markReviewedAction(o) {
    var key = o.ref + '|review';
    if (pending[key]) return;
    pending[key] = true;
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        delete pending[key];
        if (res && res.ok) {
          o.reviewedAt = res.reviewedAt;
          o.reviewedBy = res.reviewedBy;
          toast('Pesanan ditandai sudah ditinjau.');
        } else {
          toast(esc((res && res.message) || 'Gagal menandai ditinjau.'), true);
        }
        render();
      })
      .withFailureHandler(function (err) {
        delete pending[key];
        toast(esc(String((err && err.message) || err)), true);
        render();
      })
      .markReviewed({ ref: o.ref });
  }

  /* SD-01 — idempotencyKey is minted once when the form opens (see
     data-openledgerform) and deliberately NOT cleared on failure, so
     tapping Simpan again after a lost response or a timeout retries the
     exact same command instead of minting a fresh one — the server then
     recognises the replay and records the receipt once. */
  function submitLedgerRecord(o) {
    var input = document.getElementById('ledgeramount');
    var amount = input ? Number(input.value) : NaN;
    if (!isFinite(amount) || amount <= 0) {
      toast('Masukkan jumlah yang benar.', true);
      return;
    }
    if (recordingPayment) recordingPayment.amount = input.value;
    var key = o.ref + '|ledger';
    if (pending[key]) return;
    pending[key] = true;
    render();
    google.script.run
      .withSuccessHandler(function (res) {
        delete pending[key];
        if (res && res.ok) {
          o.received = res.summary.received;
          o.hasLedgerEvents = res.summary.hasLedgerEvents;
          o.paymentReconciliation = 'known';
          recordingPayment = false;
          paymentIdempotencyKey = null;
          toast('Catatan pembayaran tersimpan.');
        } else {
          toast(esc((res && res.message) || 'Gagal menyimpan catatan pembayaran.'), true);
        }
        render();
      })
      .withFailureHandler(function (err) {
        delete pending[key];
        toast(esc(String((err && err.message) || err)), true);
        render();
      })
      .recordPayment({ ref: o.ref, type: recordingPayment.type, amount: amount, idempotencyKey: paymentIdempotencyKey });
  }

  /* Manual theme override — the stylesheet already fully supports
     data-theme="light"/"dark" on :root in both directions (see the CSS at
     the top of this file), nothing ever set it. Applied immediately, before
     boot(), so there's no flash of the wrong palette. See P4-5 in
     STUDIO-DESK-UX-REVIEW.md. */
  var THEME_KEY = 'alxanthia-desk-theme-v1';
  var themeChoice = 'auto';
  try { themeChoice = localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) {}

  function applyTheme(choice) {
    if (choice === 'light' || choice === 'dark') {
      document.documentElement.setAttribute('data-theme', choice);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    Array.prototype.forEach.call(document.querySelectorAll('#themeSwitch button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.themeChoice === choice));
    });
  }
  applyTheme(themeChoice);

  function per(ref) {
    if (!state.per[ref]) state.per[ref] = {};
    return state.per[ref];
  }

  function findOrder(ref) {
    return (state.orders || []).find(function (o) { return o.ref === ref; }) || null;
  }

  function isPending(ref, field) { return !!pending[ref + '|' + field]; }

  /* =====================================================================
     Helpers shared with the layout — dates, currency, escaping.
     ===================================================================== */
  /* Prefer the server's own date (Asia/Makassar) over the device clock — a
     phone on the wrong timezone would otherwise silently shift every
     "hari ini"/"terlambat" calculation. Falls back to device time before
     the catalogue has loaded, or if it loaded degraded. See P5-7 in
     STUDIO-DESK-UX-REVIEW.md. */
  function todayStr() {
    if (state.catalog && state.catalog.serverToday) return state.catalog.serverToday;
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function daysUntil(dateStr) {
    var a = new Date(dateStr + 'T00:00:00'), b = new Date(todayStr() + 'T00:00:00');
    return Math.round((a - b) / 86400000);
  }

  function relDate(dateStr) {
    var d = daysUntil(dateStr);
    if (isNaN(d)) return '';
    if (d < 0) return (-d) + ' hari lewat';
    if (d === 0) return 'hari ini';
    if (d === 1) return 'besok';
    return d + ' hari lagi';
  }

  /* Queue date groups — only meaningful when the list is sorted by
     deadline. See P2-7 in STUDIO-DESK-UX-REVIEW.md. */
  var DATE_GROUP_LABELS = { late: 'Terlambat', today: 'Hari ini', tomorrow: 'Besok', week: 'Minggu ini', later: 'Nanti' };
  function dateGroupKey(d) {
    if (d < 0) return 'late';
    if (d === 0) return 'today';
    if (d === 1) return 'tomorrow';
    if (d <= 7) return 'week';
    return 'later';
  }

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  var DAYS = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

  function fmtDate(dateStr) {
    var p = String(dateStr || '').split('-');
    if (p.length !== 3) return String(dateStr || '');
    return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1];
  }

  /* Adds the weekday — for a flower studio that's the operative fact for
     planning, and the compact fmtDate() above drops it. Used where there's
     room (the ticket header, the top bar); card rows and inline breakdowns
     keep the compact form. See P3-5 in STUDIO-DESK-UX-REVIEW.md. */
  function fmtDateLong(dateStr) {
    var p = String(dateStr || '').split('-');
    if (p.length !== 3) return String(dateStr || '');
    var d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return fmtDate(dateStr);
    return DAYS[d.getDay()] + ', ' + fmtDate(dateStr);
  }

  function fmtStamp(stamp) {
    var parts = String(stamp || '').split(' ');
    if (parts.length < 2) return String(stamp || '');
    return fmtDate(parts[0]) + ' ' + parts[1];
  }

  function rupiah(n) { return 'Rp ' + Number(n).toLocaleString('id-ID'); }

  /* When the order list itself was last refreshed — the catalogue already
     showed this, the orders never did, though they matter far more for her
     day. See P5-2 in STUDIO-DESK-UX-REVIEW.md. */
  var ordersFetchedAt = null;
  function relTimeFromNow(d) {
    if (!d) return '';
    var diffSec = Math.round((Date.now() - d.getTime()) / 1000);
    if (diffSec < 60) return 'baru saja';
    var diffMin = Math.round(diffSec / 60);
    if (diffMin < 60) return diffMin + ' menit lalu';
    var diffHour = Math.round(diffMin / 60);
    if (diffHour < 24) return diffHour + ' jam lalu';
    return Math.round(diffHour / 24) + ' hari lalu';
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* Nudges only a horizontally-scrolling strip's own scrollLeft so its
     active item is visible, never the page's vertical scroll. Runs on
     every render() (active chip) and every ticket render (current phase),
     so it must never move window.scrollY — el.scrollIntoView({block:
     'nearest'}) looked page-scoped but still yanked the whole page back up
     whenever the strip itself was scrolled out of view (e.g. she'd
     scrolled down into an open ticket), which read as "the page jumps
     every time I do something". */
  function scrollIntoViewHorizontally(container, el) {
    if (!container || !el) return;
    // getBoundingClientRect(), not offsetLeft — offsetLeft is relative to
    // the nearest *positioned* ancestor, which isn't necessarily this
    // container, so it can silently compute the wrong delta.
    var containerRect = container.getBoundingClientRect();
    var elRect = el.getBoundingClientRect();
    if (elRect.left < containerRect.left) container.scrollLeft += elRect.left - containerRect.left;
    else if (elRect.right > containerRect.right) container.scrollLeft += elRect.right - containerRect.right;
  }

  var NAME_PREFIXES = ['ni', 'i', 'ibu', 'bu', 'bapak', 'pak', 'mbak', 'mas', 'kak'];

  function firstName(full) {
    var parts = String(full || '').trim().split(/\s+/).filter(Boolean);
    while (parts.length > 1 && NAME_PREFIXES.indexOf(parts[0].toLowerCase().replace(/\.$/, '')) !== -1) {
      parts.shift();
    }
    return parts.length ? parts[0] : '';
  }

  function humanizeKey(key) {
    return String(key || '').replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function resolveLabel(map, key) {
    var entry = map && Object.prototype.hasOwnProperty.call(map, key) ? map[key] : null;
    return entry || { name: humanizeKey(key), spec: '' };
  }

  /* Mirrors buildTicketLines_ in the Apps Script server code exactly — the
     client can't call back into that file synchronously, so this is a
     deliberate duplicate. Keep both in sync if either changes. */
  /* A stable identity for a line item's own content, independent of its
     position — mirrors itemContentKey_/itemChecklistKeys_ in Code.gs
     exactly; keep both in sync if either changes. Used only for SD-02
     checklist persistence, never for the positional c.key the DOM/local
     bench state already uses. See STUDIO-DESK-ADDITIONAL-IMPLEMENTATION.md. */
  function canonicalJson(value) {
    if (value === null || typeof value !== 'object') return JSON.stringify(value);
    if (Array.isArray(value)) return '[' + value.map(canonicalJson).join(',') + ']';
    var keys = Object.keys(value).sort();
    return '{' + keys.map(function (k) { return JSON.stringify(k) + ':' + canonicalJson(value[k]); }).join(',') + '}';
  }

  function itemContentKey(item) {
    var sig = canonicalJson(item || {});
    var hash = 5381;
    for (var i = 0; i < sig.length; i += 1) hash = ((hash * 33) ^ sig.charCodeAt(i)) >>> 0;
    return hash.toString(36);
  }

  function itemChecklistKeys(items) {
    var seen = {};
    return (items || []).map(function (item) {
      var base = itemContentKey(item);
      var n = seen[base] = (seen[base] || 0) + 1;
      return 'item:' + base + '#' + n;
    });
  }

  function buildList(order, catalog) {
    var contentKeys = itemChecklistKeys(order.items);
    return (order.items || []).map(function (item, i) {
      if (item.type === 'stem') {
        var flower = resolveLabel(catalog.flowers, item.id);
        var stemLines = flower.spec ? [{ v: flower.spec }] : [];
        stemLines.push({ k: 'bungkus', v: item.wrapped === true ? 'Dengan kertas pembungkus' : 'Tanpa kertas pembungkus' });
        return { key: 'i' + i, contentKey: contentKeys[i], qty: item.qty, name: flower.name, lines: stemLines };
      }
      if (item.type === 'pot') {
        var pot = resolveLabel(catalog.pots, item.id);
        return { key: 'i' + i, contentKey: contentKeys[i], qty: item.qty, name: pot.name, lines: pot.spec ? [{ v: pot.spec }] : [] };
      }
      if (item.type === 'package') {
        var pkg = (catalog.packages || [])[Number(item.id)];
        var stems = pkg ? pkg.stems : '?';
        return { key: 'i' + i, contentKey: contentKeys[i], qty: item.qty, name: 'Paket ' + stems + ' tangkai', lines: [{ v: 'pilihan bunga studio' }] };
      }
      if (item.type === 'custom') {
        var each = [], total = [];
        Object.keys(item.stems || {}).forEach(function (k) {
          var f = resolveLabel(catalog.flowers, k);
          each.push(item.stems[k] + '× ' + f.name);
          total.push(item.stems[k] * item.qty + '× ' + f.name);
        });
        Object.keys(item.additions || {}).forEach(function (k) {
          if (!item.additions[k]) return;
          var a = resolveLabel(catalog.additions, k);
          each.push(item.additions[k] + '× ' + a.name);
          total.push(item.additions[k] * item.qty + '× ' + a.name);
        });
        var lines = [{ k: 'per rangkaian', v: each.join(' · ') }];
        if (item.qty > 1) lines.push({ k: 'total', v: total.join(' · ') });
        return { key: 'i' + i, contentKey: contentKeys[i], qty: item.qty, name: 'Rangkaian custom', lines: lines };
      }
      return { key: 'i' + i, contentKey: contentKeys[i], qty: item.qty || 1, name: 'Item tidak dikenal', lines: [] };
    });
  }

  function billed(o) {
    if (o.shipping === null || o.shipping === undefined || o.shipping === '') return null;
    return o.verified + Number(o.shipping);
  }

  function usesDeposit(o) { return o.paymentPlan === 'Deposit 50%'; }
  function depositAmount(o) {
    var total = billed(o);
    return total === null ? null : Math.ceil(total / 2);
  }
  function balanceAmount(o) {
    var total = billed(o), deposit = depositAmount(o);
    return total === null ? null : total - deposit;
  }

  function usesBouquetWrap(items) {
    return (items || []).some(function (item) {
      return item && (item.type === 'package' || item.type === 'custom');
    });
  }

  function waitingPay(order) {
    return order.payment !== 'Paid' && order.payment !== 'Cancelled' &&
      order.phase !== 'Delivered' && order.phase !== 'Cancelled';
  }

  function matchesSearch(order, query) {
    var needle = String(query || '').trim().toLowerCase();
    if (!needle) return true;
    if (String(order.buyer || '').toLowerCase().indexOf(needle) !== -1 ||
        String(order.ref || '').toLowerCase().indexOf(needle) !== -1) return true;
    var digits = needle.replace(/[^\d]/g, '');
    if (digits && String(order.wa || '').replace(/[^\d]/g, '').indexOf(digits) !== -1) return true;
    return false;
  }

  function laneOf(order) { return order.phase; }

  /* Finished orders are archived out of the working queue the moment
     Work Phase reaches Delivered — the "Aktif" lane is everything still
     in progress. They stay reachable from the Selesai chip and, from the
     sheet's own side, for KEEP_DELIVERED_DAYS_PAST_PREFERRED_DATE days past
     their Preferred Date (see includeOrder_ in the server code — this is
     NOT days since it was marked Delivered) before listOrders() drops them
     entirely. */
  function isActive(order) {
    return order.phase !== 'Delivered' && order.phase !== 'Cancelled' && order.payment !== 'Cancelled';
  }

  /* Shared by the chip counts and the queue itself, so a lane always means
     the same thing in both places. "Cancelled" has two possible signals —
     Payment Status (set from the Desk) or Work Phase (set from the sheet) —
     see P5-6 in STUDIO-DESK-UX-REVIEW.md; the Dibatalkan lane matches
     either. */
  function laneMatch(order, laneKey) {
    if (laneKey === 'all') return isActive(order);
    if (laneKey === 'pay') return waitingPay(order);
    if (laneKey === 'late') return isActive(order) && daysUntil(order.date) < 0;
    if (laneKey === 'today') return isActive(order) && daysUntil(order.date) === 0;
    if (laneKey === 'cancelled') return order.payment === 'Cancelled' || order.phase === 'Cancelled';
    return laneOf(order) === laneKey;
  }

  /* The filtered, sorted list she is actually looking at — computed once and
     shared between renderQueue() and the default-selection logic in
     render(), so the ticket on the right is always the card at the top of
     the list on the left. */
  function visibleOrders() {
    return state.orders.filter(function (o) {
      return laneMatch(o, state.lane) && matchesSearch(o, state.search);
    }).sort(function (a, b) {
      if (state.sort === 'in') return a.submitted < b.submitted ? -1 : a.submitted > b.submitted ? 1 : 0;
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
  }

  /* =====================================================================
     The gate: four checks read from the sheet, one she ticks herself.
     ===================================================================== */
  function gate(order, catalog) {
    var auto = [];
    var pay = order.payment;
    var payLabel = (PAYMENTS.find(function (p) { return p.key === pay; }) || {}).label || pay;
    auto.push({
      ok: pay === 'Paid' || pay === 'Deposit paid',
      blocking: true,
      label: pay === 'Paid' ? 'Pembayaran lunas' : (pay === 'Deposit paid' ? 'DP 50% diterima' : 'Pembayaran belum diterima'),
      sub: 'Status di sheet: ' + payLabel
    });
    auto.push({
      ok: !order.mismatch,
      blocking: true,
      label: order.mismatch ? 'Harga ditandai REVIEW' : 'Harga terverifikasi',
      sub: order.mismatch
        ? 'Verified Total dan Submitted Total beda di sheet — cek dulu sebelum mulai.'
        : rupiah(order.verified) + ' (produk + kartu, terverifikasi server)'
    });
    var d = daysUntil(order.date);
    var leadDays = (catalog && catalog.minimumLeadDays) || 2;
    /* A past Preferred Date is worth a warning, not a permanent lock — she
       still has to make the order. An unreadable date is different: there is
       nothing to warn about, so that one stays blocking. */
    if (isNaN(d)) {
      auto.push({
        ok: false,
        blocking: true,
        label: 'Tanggal pesanan tidak terbaca',
        sub: 'Cek tanggal pesanan ini — formatnya tidak bisa dibaca.'
      });
    } else {
      auto.push({
        ok: d >= 0,
        blocking: false,
        label: d < 0 ? 'Sudah lewat tanggal' : (d < leadDays ? 'Tanggal mepet' : 'Tanggal masih cukup'),
        sub: fmtDate(order.date) + ' · ' + relDate(order.date)
      });
    }
    auto.push(order.locationType === 'bali'
      ? {
          ok: !!(order.regency && order.method),
          blocking: true,
          label: 'Tujuan lengkap',
          sub: (order.regency || '—') + ' · ' + (order.method === 'self_pickup' ? 'ambil sendiri' : 'Grab / Gojek')
        }
      : {
          ok: !!(order.address && order.city && order.postal),
          blocking: true,
          label: 'Tujuan lengkap',
          sub: (order.city || '—') + ' ' + (order.postal || '')
        });

    var manual = order.card ? [{ key: 'card', label: 'Teks kartu sudah dibaca ulang' }] : [];
    var ticks = per(order.ref).ticks || {};
    var autoOk = auto.every(function (c) { return !c.blocking || c.ok; });
    var allOk = auto.every(function (c) { return c.ok; });
    var manualOk = manual.every(function (m) { return ticks[m.key]; });
    return { auto: auto, manual: manual, autoOk: autoOk, allOk: allOk, ready: autoOk && manualOk };
  }

  /* =====================================================================
     Rendering
     ===================================================================== */
  var elShell = document.getElementById('shell');
  var elApp = document.getElementById('app');
  var elSkeleton = document.getElementById('skeleton');
  var elErrorScreen = document.getElementById('errorScreen');
  var elErrorMessage = document.getElementById('errorMessage');
  var elRetryBtn = document.getElementById('retryBtn');
  var elRefreshBtn = document.getElementById('refreshBtn');
  var elStaleBanner = document.getElementById('staleBanner');
  var elReloadCatalogBtn = document.getElementById('reloadCatalogBtn');
  var elCatalogMeta = document.getElementById('catalogMeta');
  var elOrdersMeta = document.getElementById('ordersMeta');
  var elQueue = document.getElementById('queue');
  var elTicket = document.getElementById('ticket');
  var elChips = document.getElementById('chips');
  var elPulse = document.getElementById('pulse');
  var elSort = document.getElementById('sort');
  var elSearch = document.getElementById('orderSearch');

  function render() {
    document.getElementById('today').textContent = fmtDateLong(todayStr()) + ' · WITA';

    if (state.ordersError) {
      elSkeleton.hidden = true;
      elApp.hidden = true;
      elErrorScreen.hidden = false;
      elErrorMessage.textContent = state.ordersError;
      return;
    }
    if (state.orders === null || state.catalog === null) {
      elErrorScreen.hidden = true;
      elApp.hidden = true;
      elSkeleton.hidden = false;
      return;
    }
    elErrorScreen.hidden = true;
    elSkeleton.hidden = true;
    elApp.hidden = false;
    elRefreshBtn.hidden = false;

    /* Offline takes priority over the catalogue banners — a dropped
       connection otherwise only surfaced as a red toast after she'd already
       tapped something. See P5-1 in STUDIO-DESK-UX-REVIEW.md. */
    document.body.classList.toggle('offline', !navigator.onLine);
    if (!navigator.onLine) {
      elStaleBanner.hidden = false;
      elStaleBanner.textContent = 'Tidak ada koneksi — perubahan belum tersimpan.';
    } else if (state.catalogError) {
      elStaleBanner.hidden = false;
      elStaleBanner.textContent = 'Katalog tidak bisa dimuat — nama bunga tampil apa adanya. Data pesanan dan semua angka tetap akurat.';
    } else if (state.catalog.stale) {
      elStaleBanner.hidden = false;
      elStaleBanner.textContent = 'Katalog tidak bisa dimuat ulang dari situs — nama bunga/paket di bawah mungkin sudah lama. Data pesanan dan angka tetap akurat.';
    } else {
      elStaleBanner.hidden = true;
    }
    elCatalogMeta.textContent = state.catalog.fetchedAt ? ('katalog dimuat ' + fmtStamp(state.catalog.fetchedAt)) : '';
    /* The catalogue already showed when it was fetched; the orders — which
       matter far more for her day — never did. See P5-2. */
    elOrdersMeta.textContent = ordersFetchedAt ? ('diperbarui ' + relTimeFromNow(ordersFetchedAt)) : '';

    reconcileSelection();

    renderTop();
    renderQueue();
    renderTicket();
  }

  /* Keeps the open ticket in sync with whatever the left-hand list is
     currently showing — a lane switch, a search, or an order leaving the
     visible set (e.g. marked Selesai) must never leave the ticket pointing
     at a card that isn't there any more. See P2-1 in
     STUDIO-DESK-UX-REVIEW.md. */
  function reconcileSelection() {
    var visible = visibleOrders();
    var stillVisible = state.selected && visible.some(function (o) { return o.ref === state.selected; });
    if (!stillVisible) state.selected = visible.length ? visible[0].ref : null;
  }

  function renderTop() {
    var late = 0, today = 0, pay = 0, working = 0, fresh = 0;
    state.orders.forEach(function (o) {
      if (o.submitted > lastSeenAt) fresh++;
      if (!isActive(o)) return;
      var d = daysUntil(o.date);
      if (d < 0) late++;
      else if (d === 0) today++;
      if (waitingPay(o)) pay++;
      if (o.phase === 'Assembly and packing') working++;
    });
    /* Each number is also a button, mapped to a lane — see P2-6 in
       STUDIO-DESK-UX-REVIEW.md. Terlambat/Jatuh tempo hari ini have no
       permanent chip of their own; renderTop() adds a temporary one below
       while either is selected. Pesanan baru (P2-3) isn't a lane — it's
       cleared just by opening a ticket — so it isn't a button. */
    elPulse.innerHTML =
      '<button type="button" class="pulse-item" data-lane="today" aria-pressed="' + (state.lane === 'today') +
        '"><b>' + today + '</b><span>jatuh tempo hari ini</span></button>' +
      (late ? '<button type="button" class="pulse-item late" data-lane="late" aria-pressed="' + (state.lane === 'late') +
        '"><b>' + late + '</b><span>terlambat</span></button>' : '') +
      '<button type="button" class="pulse-item pay" data-lane="pay" aria-pressed="' + (state.lane === 'pay') +
        '"><b>' + pay + '</b><span>menunggu bayar</span></button>' +
      '<button type="button" class="pulse-item" data-lane="Assembly and packing" aria-pressed="' + (state.lane === 'Assembly and packing') +
        '"><b>' + working + '</b><span>sedang dikerjakan</span></button>' +
      (fresh ? '<div class="pulse-item static"><b>' + fresh + '</b><span>pesanan baru</span></div>' : '');

    var lanes = [{ key: 'all', label: 'Aktif' }, { key: 'pay', label: 'Menunggu bayar' }]
      .concat(PHASES.map(function (p) { return { key: p.key, label: p.label }; }))
      .concat([{ key: 'cancelled', label: 'Dibatalkan' }]);
    if (state.lane === 'late') lanes.splice(1, 0, { key: 'late', label: 'Terlambat' });
    if (state.lane === 'today') lanes.splice(1, 0, { key: 'today', label: 'Jatuh tempo hari ini' });

    elChips.innerHTML = lanes.map(function (l) {
      var n = state.orders.filter(function (o) { return laneMatch(o, l.key); }).length;
      return '<button type="button" data-lane="' + esc(l.key) + '" aria-pressed="' + (state.lane === l.key) +
        '">' + esc(l.label) + '<span class="n">' + n + '</span></button>';
    }).join('');

    var activeChip = elChips.querySelector('[aria-pressed="true"]');
    if (activeChip) scrollIntoViewHorizontally(elChips, activeChip);

    Array.prototype.forEach.call(elSort.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.sort === state.sort));
    });
  }

  function renderQueue() {
    var catalog = state.catalog;
    var list = visibleOrders();

    if (!list.length) {
      var crossLaneHtml = '';
      if (state.search) {
        var allMatches = state.orders.filter(function (o) { return matchesSearch(o, state.search); });
        if (allMatches.length) {
          var laneKeys = {};
          allMatches.forEach(function (o) { laneKeys[o.payment === 'Cancelled' ? 'cancelled' : o.phase] = true; });
          var laneKeyList = Object.keys(laneKeys);
          var targetLane = laneKeyList.length === 1 ? laneKeyList[0] : 'all';
          var targetLabel = targetLane === 'cancelled' ? 'Dibatalkan' :
            ((PHASES.find(function (p) { return p.key === targetLane; }) || {}).label || 'Aktif');
          crossLaneHtml = '<p>Tidak ada di daftar ini.</p><button type="button" class="btn ghost small" data-crosslane="' +
            esc(targetLane) + '">Ada ' + allMatches.length + ' pesanan cocok di ' + esc(targetLabel) + ' — lihat</button>';
        }
      }
      elQueue.innerHTML = '<li class="queue-empty">' +
        (crossLaneHtml || (state.search ? 'Tidak ada pesanan yang cocok.' : 'Tidak ada pesanan di kelompok ini.')) + '</li>';
      return;
    }

    function cardLi(o) {
      var d = daysUntil(o.date);
      var phase = o.phase;
      var cls = 'card';
      if (phase !== 'Delivered') {
        if (d < 0) cls += ' is-late';
        else if (d === 0) cls += ' is-today';
        else if (phase !== 'Not started') cls += ' is-working';
      }

      /* Capped at three, in priority order, so Review (the one that means
         "stop, the price is wrong") never gets lost among five same-weight
         tags — see P4-6 in STUDIO-DESK-UX-REVIEW.md. Baru ranks first: an
         order she's never opened is the one thing she'd otherwise miss
         entirely. The wrap colour moves inline next to the summary as a
         bare chip, and Kartu is dropped — both are already unmissable once
         the ticket itself is open. */
      var tagCandidates = [];
      if (o.submitted > lastSeenAt) tagCandidates.push('<span class="tag go">Baru</span>');
      if (o.mismatch) tagCandidates.push('<span class="tag stop"><span class="dot"></span>Review</span>');
      if (waitingPay(o)) {
        var pl = (PAYMENTS.find(function (p) { return p.key === o.payment; }) || {}).label || o.payment;
        tagCandidates.push('<span class="tag warn"><span class="dot"></span>' + esc(pl) + '</span>');
      } else if (o.payment === 'Cancelled') {
        tagCandidates.push('<span class="tag stop"><span class="dot"></span>Dibatalkan</span>');
      }
      var phaseEntry = PHASES.find(function (p) { return p.key === phase; });
      if (phase !== 'Not started' && phaseEntry) {
        tagCandidates.push('<span class="tag go"><span class="dot"></span>' + esc(phaseEntry.label) + '</span>');
      } else if (gate(o, catalog).autoOk) {
        tagCandidates.push('<span class="tag go"><span class="dot"></span>Siap dikerjakan</span>');
      }
      var tags = tagCandidates.slice(0, 3);

      var wrapSwatchHtml = '';
      if (usesBouquetWrap(o.items)) {
        var w = catalog.wraps[o.wrap] || { name: humanizeKey(o.wrap), swatch: '#999' };
        wrapSwatchHtml = '<span class="swatch" style="background:' + esc(w.swatch) + '" title="' + esc(w.name) + '"></span>';
      }

      var summary = o.items.length
        ? buildList(o, catalog).map(function (r) { return r.qty + '× ' + r.name; }).join(' · ')
        : o.itemsRaw;

      return '<li><button type="button" class="' + cls + '" data-ref="' + esc(o.ref) + '"' +
        (state.selected === o.ref ? ' aria-current="true"' : '') + '>' +
        '<span class="stripe"></span>' +
        '<span class="body">' +
          '<span class="row1"><span class="ref">' + esc(o.ref) + '</span>' +
            '<span class="due">' + esc(fmtDate(o.date)) + ' · ' + esc(relDate(o.date)) + '</span></span>' +
          '<span class="who">' + esc(o.buyer) + '</span>' +
          '<span class="what">' + wrapSwatchHtml + esc(summary) + '</span>' +
          '<span class="in">masuk ' + esc(fmtStamp(o.submitted)) + '</span>' +
          '<span class="tags">' + tags.join('') + '</span>' +
        '</span></button></li>';
    }

    /* Date-based group headers only make sense when the list is actually
       sorted by date — see P2-7 in STUDIO-DESK-UX-REVIEW.md. */
    if (state.sort === 'due') {
      var lastGroup = null;
      elQueue.innerHTML = list.map(function (o) {
        var d = daysUntil(o.date);
        var g = isNaN(d) ? 'later' : dateGroupKey(d);
        var headerHtml = '';
        if (g !== lastGroup) {
          headerHtml = '<li class="queue-group" role="presentation">' + esc(DATE_GROUP_LABELS[g]) + '</li>';
          lastGroup = g;
        }
        return headerHtml + cardLi(o);
      }).join('');
    } else {
      elQueue.innerHTML = list.map(cardLi).join('');
    }
  }

  /* SD-04 — explicit review completion. Opening the ticket never marks it
     reviewed; only this tap does. */
  function reviewBlock(o) {
    if (o.reviewedAt) {
      return '<div class="block"><h3>Tinjau pesanan</h3>' +
        '<p class="why">Sudah ditinjau ' + esc(fmtStamp(o.reviewedAt)) +
        (o.reviewedBy ? ' oleh ' + esc(o.reviewedBy) : '') + '.</p></div>';
    }
    var reviewPending = isPending(o.ref, 'review');
    return '<div class="block"><h3>Tinjau pesanan</h3>' +
      '<p class="why">Periksa barang, tanggal pesanan, dan cara pengantaran sebelum mulai — lalu tandai sudah ditinjau.</p>' +
      '<div class="actions"><button type="button" class="btn" data-markreviewed="1"' +
      (reviewPending ? ' disabled' : '') + '>Tandai sudah ditinjau</button></div></div>';
  }

  /* SD-01 — the verified payment ledger, alongside (not replacing) the
     existing Payment Status workflow above. "Diterima" only ever reflects
     recorded ledger events, never the status string. */
  function ledgerBlock(o) {
    var total = billed(o);
    var received = o.received || 0;
    var outstanding = total === null ? null : (total - received);
    var html = '<div class="block"><h3>Pembayaran terverifikasi</h3>' +
      '<div class="breakdown"><span>Diterima ' + esc(rupiah(received)) + '</span>';
    if (outstanding !== null) {
      if (outstanding > 0) html += '<span>Sisa ' + esc(rupiah(outstanding)) + '</span>';
      else if (outstanding < 0) html += '<span>Kredit ' + esc(rupiah(-outstanding)) + '</span>';
      else html += '<span>Lunas terverifikasi</span>';
    }
    html += '</div>';
    if (o.paymentReconciliation === 'legacy_unreconciled') {
      html += '<p class="why">Riwayat sebelum fitur ini dicatat belum ada di sini — status pembayaran di atas tetap berlaku ' +
        'sampai direkonsiliasi manual oleh pemilik studio.</p>';
    }
    html += ledgerFormHtml(o);
    return html + '</div>';
  }

  function ledgerFormHtml(o) {
    if (!recordingPayment) {
      return '<div class="actions"><button type="button" class="btn ghost small" data-openledgerform="1">Catat pembayaran</button></div>';
    }
    var ledgerPending = isPending(o.ref, 'ledger');
    var typeLabels = { receipt: 'Terima', refund: 'Kembalikan', correction: 'Koreksi' };
    return '<div class="confirm">' +
      '<span class="k">Jenis</span>' +
      '<div class="seg" role="group" aria-label="Jenis catatan pembayaran">' +
      ['receipt', 'refund', 'correction'].map(function (t) {
        return '<button type="button" data-ledgertype="' + t + '" aria-pressed="' + (recordingPayment.type === t) +
          '"' + (ledgerPending ? ' disabled' : '') + '>' + typeLabels[t] + '</button>';
      }).join('') + '</div>' +
      '<div class="ongkir" style="margin-top:10px"><label for="ledgeramount">Jumlah</label>' +
      '<span class="amtwrap"><span class="prefix" aria-hidden="true">Rp</span>' +
      '<input id="ledgeramount" type="number" inputmode="numeric" min="0" step="1000" value="' +
      esc(recordingPayment.amount || '') + '"' + (ledgerPending ? ' disabled' : '') + '></span></div>' +
      '<div class="actions">' +
      '<button type="button" class="btn" data-submitledger="1"' + (ledgerPending ? ' disabled' : '') + '>Simpan</button>' +
      '<button type="button" class="btn ghost" data-cancelledgerform="1"' + (ledgerPending ? ' disabled' : '') + '>Batal</button>' +
      '</div></div>';
  }

  /* SD-03 — read-only activity feed, collapsed like the provenance block
     since it's reference material, not something she needs open by
     default. */
  function riwayatBlock(o) {
    var rows = state.activity[o.ref] || [];
    if (!rows.length) return '';
    return '<details class="provenance"><summary>Riwayat (' + rows.length + ')</summary>' +
      rows.map(function (r) { return '<span>' + esc(fmtStamp(r.at)) + ' — ' + esc(r.detail) + '</span>'; }).join('') +
      '</details>';
  }

  function generateIdempotencyKey() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return 'idem-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  }

  /* The most destructive action in the Desk, on its own at the bottom of
     the ticket instead of sharing an .actions row with routine payment
     buttons — see P3-6 in STUDIO-DESK-UX-REVIEW.md. The confirm step
     (unchanged) still guards it. */
  function cancelBlock(o) {
    if (o.payment === 'Cancelled') return '';
    var html = '<div class="block"><button type="button" class="btn ghost" data-askcancel="1">Batalkan pesanan</button>';
    if (confirming === 'cancel') {
      html += '<div class="confirm"><p>Batalkan pesanan ' + esc(o.ref) + '? Pesanan akan ditandai dibatalkan.</p>' +
        '<div class="actions"><button type="button" class="btn" data-pay="Cancelled" data-fk="confirm-primary">Ya, batalkan</button>' +
        '<button type="button" class="btn ghost" data-cancelconfirm="1">Tidak</button></div></div>';
    }
    return html + '</div>';
  }

  function paymentBlock(o) {
    var pay = o.payment;
    if (pay === 'Paid') {
      var paidAmount = billed(o);
      return '<div class="block"><h3 data-fk="paymentHeading" tabindex="-1">Pembayaran</h3>' +
        '<div class="paid-line"><span class="ok">Lunas</span>' +
        '<span class="amt">' + esc(paidAmount === null ? '—' : rupiah(paidAmount)) + '</span></div>' +
        '<div class="breakdown"><span>Produk &amp; kartu ' + esc(rupiah(o.verified)) + '</span>' +
        '<span>Ongkir ' + (o.shipping === null || o.shipping === undefined || o.shipping === ''
          ? 'belum diisi' : esc(rupiah(o.shipping))) + '</span></div>' +
        '<div class="actions">' +
        '<button type="button" class="btn ghost" data-sendpaid="1">Kirim konfirmasi lunas</button>' +
        '</div></div>';
    }

    var ship = o.shipping;
    var amount = billed(o);
    var deposit = depositAmount(o);
    var balance = balanceAmount(o);
    var isDeposit = usesDeposit(o);
    var shippingPending = isPending(o.ref, 'shipping');
    var paymentPending = isPending(o.ref, 'payment');
    var planPending = isPending(o.ref, 'paymentPlan');
    var shipErr = fieldErrors[o.ref + '|shipping'];
    var payErr = fieldErrors[o.ref + '|payment'] || fieldErrors[o.ref + '|paymentPlan'];
    var bank = state.catalog.bank || {};
    var bankReady = !!bank.number;
    var readyIndex = PHASES.findIndex(function (x) { return x.key === 'Ready for dispatch'; });
    var phaseIndex = PHASES.findIndex(function (x) { return x.key === o.phase; });
    var balanceDue = phaseIndex >= readyIndex;

    var html = '<div class="block pay-open"><h3 data-fk="paymentHeading" tabindex="-1">Pembayaran</h3>' +
      '<div class="amount"><span class="big">' + esc(amount === null ? '—' : rupiah(amount)) + '</span>' +
      '<span class="lbl">total yang ditagih ke pembeli</span></div>' +
      '<div class="breakdown"><span>Produk &amp; kartu ' + esc(rupiah(o.verified)) + '</span>' +
      '<span>Ongkir ' + (ship === null || ship === undefined || ship === '' ? 'belum diisi' : esc(rupiah(ship))) + '</span></div>';

    /* A segmented toggle, not two same-weight buttons next to Tandai lunas —
       see P3-2 in STUDIO-DESK-UX-REVIEW.md. Placed right under the total it
       explains, and locked once a transfer has actually started (mirroring
       the server's own PAYMENT_STARTED check — a convenience, not the real
       guard; ground rule 5). */
    var planLocked = pay !== 'Unpaid';
    html += '<div style="margin-top:14px"><span class="k">Cara pembayaran</span>' +
      '<div class="seg" role="group" aria-label="Cara pembayaran">' +
      '<button type="button" data-plan="Full" aria-pressed="' + (!isDeposit) + '"' +
        (planLocked || planPending ? ' disabled' : '') + '>Bayar penuh</button>' +
      '<button type="button" data-plan="Deposit 50%" aria-pressed="' + isDeposit + '"' +
        (planLocked || planPending || amount === null ? ' disabled' : '') + '>DP 50%</button></div>' +
      (planLocked ? '<span class="hint" style="display:block;margin-top:6px">Cara pembayaran terkunci setelah pembayaran mulai diproses.</span>' : '') +
      '</div>';

    if (isDeposit && amount !== null) {
      html += '<div class="breakdown"><span>DP 50% ' + esc(rupiah(deposit)) + '</span>' +
        '<span>Sisa pelunasan ' + esc(rupiah(balance)) + '</span></div>';
    }

    if (o.locationType === 'bali') {
      html += '<div class="ongkir"><span class="hint">Ongkir Rp 0 — ' +
        (o.method === 'self_pickup' ? 'diambil sendiri di studio.' : 'Grab/Gojek dibayar langsung ke driver.') +
        '</span></div>';
    } else {
      /* A bare number input reads ambiguously (45000 vs 450000) for a
         figure that goes straight onto the customer's bill — a static Rp
         prefix plus a live formatted echo fix that without fighting the
         numeric keypad. See P3-4 in STUDIO-DESK-UX-REVIEW.md. */
      html += '<div class="ongkir"><label for="ongkir-' + esc(o.ref) + '">Ongkir</label>' +
        '<span class="amtwrap"><span class="prefix" aria-hidden="true">Rp</span>' +
        '<input id="ongkir-' + esc(o.ref) + '" type="number" inputmode="numeric" min="0" step="1000" ' +
        'value="' + (ship === null || ship === undefined ? '' : esc(ship)) + '" placeholder="0"' +
        (shippingPending ? ' disabled' : '') + '></span>' +
        '<span class="hint" id="ongkirEcho">' + (ship === null || ship === undefined || ship === '' ? '' : ('= ' + esc(rupiah(ship)))) + '</span>' +
        '<span class="hint">Kurir ke ' + esc(o.city) + '. Sisa pelunasan mengikuti total terbaru.</span>' +
        '<span class="hint" id="shippingSaving"' + (shippingPending ? '' : ' hidden') + '>Menyimpan…</span></div>';
      /* Right under the field it explains, not after the action buttons
         below it — see P3-3 in STUDIO-DESK-UX-REVIEW.md. */
      if (amount === null) html += '<p class="why">Isi ongkir dulu supaya totalnya bisa ditagih.</p>';
      if (shipErr) html += '<p class="why err">' + esc(shipErr) + '</p>';
    }

    if (pay === 'Cancelled') {
      html += '<div class="paid-line"><span class="cancelled">Dibatalkan</span></div>';
      if (isDeposit) {
        /* Un-cancelling used to always reset to Unpaid, silently erasing the
           record that a deposit had already landed — see P1-5 in
           STUDIO-DESK-UX-REVIEW.md. Ask instead of guessing. */
        html += '<span class="why">Jika DP sudah diterima sebelum dibatalkan, aktifkan lewat tombol pertama supaya pembeli tidak diminta bayar dua kali.</span>' +
          '<div class="actions">' +
          '<button type="button" class="btn" data-pay="Deposit paid">Aktifkan — DP sudah diterima</button>' +
          '<button type="button" class="btn ghost" data-pay="Unpaid">Aktifkan — belum ada pembayaran</button>' +
          '</div>';
      } else {
        html += '<div class="actions"><button type="button" class="btn ghost" data-pay="Unpaid">Aktifkan lagi</button></div>';
      }
    } else if (isDeposit) {
      var depositReceived = pay === 'Deposit paid' || pay === 'Checking balance';
      html += '<div class="paid-line"><span class="' + (depositReceived ? 'ok' : '') + '">' +
        (depositReceived ? 'DP diterima' : (pay === 'Checking deposit' ? 'DP perlu dicek' : 'Belum bayar DP')) + '</span>' +
        '<span class="amt">' + esc(rupiah(depositReceived ? balance : deposit)) + '</span></div>' +
        '<div class="actions">' +
        (!depositReceived
          ? '<button type="button" class="btn ghost" data-sendpayment="deposit"' + (bankReady ? '' : ' disabled') + '>Kirim tagihan DP</button>' +
            '<button type="button" class="btn ghost" data-pay="Checking deposit">Tandai DP perlu dicek</button>' +
            '<button type="button" class="btn" data-askpaid="Deposit paid">Tandai DP diterima</button>'
          : (balanceDue
            ? (o.phase === 'Ready for dispatch'
                ? '<button type="button" class="btn" data-sendpayment="balance"' + (bankReady ? '' : ' disabled') + '>Kirim pesan pelunasan</button>'
                : '') +
              '<button type="button" class="btn ghost" data-pay="Checking balance">Tandai perlu dicek</button>' +
              '<button type="button" class="btn" data-askpaid="Paid">Tandai lunas</button>'
            : '<span class="why">Pelunasan diminta saat pesanan Siap dikirim.</span>')) +
        '</div>';
    } else {
      html += '<div class="actions"><button type="button" class="btn ghost" data-sendpayment="full"' + (bankReady ? '' : ' disabled') + '>Kirim pesan</button>' +
        '<button type="button" class="btn ghost" data-pay="Checking transfer">Tandai perlu dicek</button>' +
        '<button type="button" class="btn" data-askpaid="Paid">Tandai lunas</button></div>';
    }

    if (!bankReady) html += '<span class="why">Nomor rekening belum diisi — pesan pembayaran tidak bisa dikirim.</span>';
    if (payErr) html += '<span class="why err">' + esc(payErr) + '</span>';
    if (confirming && confirming !== 'cancel' && amount !== null) {
      var target = confirming === 'Deposit paid' ? deposit : (confirming === 'Paid' && isDeposit ? balance : amount);
      html += '<div class="confirm"><p><b>' + esc(rupiah(target)) + '</b> sudah masuk ke rekening ' +
        esc(bank.bank || '—') + ' ' + esc(bank.number || '') + '?</p>' +
        '<p class="rule">Cek di mutasi rekening — jangan dari screenshot pembeli.</p>' +
        '<div class="actions"><button type="button" class="btn" data-pay="' + esc(confirming) + '" data-fk="confirm-primary">Ya, sudah masuk</button>' +
        '<button type="button" class="btn ghost" data-cancelconfirm="1">Batal</button></div></div>';
    }
    return html + '</div>';
  }

  function renderTicket() {
    var o = findOrder(state.selected);
    if (!o) { elTicket.innerHTML = '<div class="block"><p class="why">Pilih pesanan dari daftar.</p></div>'; return; }
    var catalog = state.catalog;
    markSeen(o);
    loadTicketExtras(o);

    var p = per(o.ref);
    var g = gate(o, catalog);
    var comps = buildList(o, catalog);
    var ticks = p.ticks || {};
    var compState = p.comps || {};
    var doneComps = comps.filter(function (c) { return compState[c.key]; }).length;
    var d = daysUntil(o.date);
    var phase = o.phase;
    var pIndex = PHASES.findIndex(function (x) { return x.key === phase; });
    var headCls = phase === 'Delivered' ? '' : (d < 0 ? ' is-late' : (d === 0 ? ' is-today' : ''));
    var phasePending = isPending(o.ref, 'phase');
    var phaseErr = fieldErrors[o.ref + '|phase'];
    var notesPending = isPending(o.ref, 'notes');

    var phaseEntry = PHASES.find(function (x) { return x.key === phase; });

    var html = '<button type="button" class="back" data-back="1">← Daftar pesanan</button>' +
      '<div class="ticket-head' + headCls + '">' +
        '<div class="id"><div class="ref">' + esc(o.ref) + '</div>' +
          (phaseEntry ? '<span class="tag go" style="margin:5px 0 1px">' + esc(phaseEntry.label) + '</span>' : '') +
          '<h2>' + esc(o.buyer) + '</h2>' +
          '<a class="wa" href="https://wa.me/' + esc(String(o.wa).replace('+', '')) + '" target="_blank" rel="noopener">' + esc(o.wa) + '</a>' +
          '<span class="in">masuk ' + esc(fmtStamp(o.submitted)) + '</span></div>' +
        '<div class="when"><span class="d">' + esc(fmtDateLong(o.date)) + '</span>' +
          '<span class="rel">' + esc(relDate(o.date)) + '</span></div>' +
      '</div>';

    html += reviewBlock(o);
    html += paymentBlock(o);
    html += ledgerBlock(o);

    var isCancelled = o.payment === 'Cancelled';
    if (isCancelled) {
      /* A cancelled order can still show working controls (start, tick
         items, advance phase) that make no sense once it's cancelled — see
         P5-5 in STUDIO-DESK-UX-REVIEW.md. Collapse make/finishing/phase
         behind one line; the reactivation path stays in paymentBlock(). */
      html += '<div class="block"><p class="why">Pesanan ini dibatalkan — detail pembuatan dan tahap kerja' +
        ' disembunyikan. Aktifkan kembali di atas untuk melanjutkan.</p></div>';
    }

    /* Verification gate — only while the work has not started. */
    if (!isCancelled && pIndex <= 0) {
      html += '<div class="block"><h3>Periksa dulu</h3><ul class="checks">' +
        g.auto.map(function (c) {
          return '<li class="' + (c.ok ? 'pass' : 'fail') + '"><span class="mark" aria-hidden="true">' +
            (c.ok ? '✓' : '✕') + '</span><span>' + esc(c.label) +
            '<span class="sub">' + esc(c.sub) + '</span></span></li>';
        }).join('') + '</ul>' +
        g.manual.map(function (m) {
          var on = !!ticks[m.key];
          return '<button type="button" class="tick" data-tick="' + esc(m.key) + '" data-fk="tick-' + esc(m.key) +
            '" aria-pressed="' + on + '"><span class="box" aria-hidden="true">✓</span>' +
            '<span class="label">' + esc(m.label) + '</span></button>';
        }).join('') +
        '<div class="actions"><button type="button" class="btn" data-advance="1"' + (g.ready && !phasePending ? '' : ' disabled') + '>' +
        (g.ready && !g.allOk ? 'Tetap mulai kerjakan' : 'Mulai kerjakan') + '</button><span class="why' + (phaseErr ? ' err' : '') + '">' +
        (phaseErr || (g.ready
          ? (g.allOk ? '' : 'Tanggalnya sudah lewat — kabari pembeli dulu kalau perlu.')
          : (g.autoOk ? 'Centang baris di atas dulu.' : 'Belum bisa dimulai — lihat tanda merah di atas.'))) +
        '</span></div></div>';
    }

    if (!isCancelled) {
      /* What to make — one tick per line item. */
      html += '<div class="block"><h3>Yang dibuat<span class="count" id="compCount">' + doneComps + '/' + comps.length + ' item</span></h3>' +
        (comps.length
          ? '<ul class="make">' + comps.map(function (c) {
              var on = !!compState[c.key];
              return '<li><button type="button" class="comp" data-comp="' + esc(c.key) + '" data-contentkey="' + esc(c.contentKey) +
                '" data-fk="comp-' + esc(c.key) +
                '" aria-pressed="' + on + '"><span class="box" aria-hidden="true">✓</span>' +
                '<span class="qty">' + c.qty + '×</span><span><span class="name">' + esc(c.name) + '</span>' +
                c.lines.map(function (l) {
                  return '<span class="spec">' + (l.k ? '<span class="k">' + esc(l.k) + ':</span> ' : '') + esc(l.v) + '</span>';
                }).join('') +
                '</span></button></li>';
            }).join('') + '</ul>'
          : '<p class="why">' + esc(o.itemsRaw || 'Tidak ada rincian item.') + '</p>') + '</div>';

      /* Finishing — bouquet colour (when relevant) and the card. Individual
         flower wrapping is shown on its own item line above. */
      html += '<div class="block"><h3>Penyelesaian</h3>';
      if (usesBouquetWrap(o.items)) {
        var w = catalog.wraps[o.wrap] || { name: humanizeKey(o.wrap), swatch: '#999' };
        html += '<div class="pair"><span class="k">Warna kertas buket</span><span class="v">' +
          '<span class="swatch" style="background:' + esc(w.swatch) + '"></span>' + esc(w.name) + '</span></div>';
      }

      if (o.card) {
        html += '<div style="margin-top:15px"><span class="k" style="display:block;font:600 10.5px/1 var(--sans);' +
          'letter-spacing:.11em;text-transform:uppercase;color:var(--muted)">Kartu ucapan — tulis apa adanya</span>' +
          '<div class="cardnote"><p>' + esc(o.card.text) + '</p>' +
          '<div class="meta"><span>Untuk: ' + esc(o.card.to) + '</span><span>Dari: ' + esc(o.card.from) + '</span></div>' +
          '<div class="actions"><button type="button" class="btn ghost small" data-copycard="1">Salin teks kartu</button></div>' +
          '</div></div>';
      } else {
        html += '<p style="margin:14px 0 0;font-size:13px;color:var(--muted)">Tanpa kartu ucapan.</p>';
      }
      html += '</div>';
    }

    /* Delivery — kept visible even when cancelled; it's information, not a
       working control. */
    var dest = o.locationType === 'bali'
      ? (o.method === 'self_pickup' ? 'Ambil sendiri di studio' : 'Grab / Gojek') + ' · ' + o.regency
      : 'Kurir ke luar Bali · ' + o.address + ', ' + o.city + ' ' + o.postal;
    html += '<div class="block"><h3>Pengantaran</h3><div style="font-size:14.5px">' + esc(dest) + '</div></div>';

    var packingRequired = !isCancelled && phase === 'Assembly and packing';
    if (packingRequired) {
      /* SD-02: a distinct final packing checklist, separate from the
         per-item make list — required before Lanjut out of this phase. */
      var packingState = per(o.ref).packing || {};
      html += '<div class="block"><h3 data-fk="packingHeading" tabindex="-1">Cek sebelum siap kirim</h3>' +
        packingItemsFor(o).map(function (item) {
          var on = !!packingState[item.key];
          return '<button type="button" class="tick" data-packing="' + esc(item.key) + '" data-fk="packing-' + esc(item.key) +
            '" aria-pressed="' + on + '"><span class="box" aria-hidden="true">✓</span>' +
            '<span class="label">' + esc(item.label) + '</span></button>';
        }).join('') + '</div>';
    }

    if (!isCancelled) {
      /* Work phase — all five (Cancelled aside) are hers. */
      html += '<div class="block"><h3 data-fk="phaseHeading" tabindex="-1">Tahap kerja</h3><div class="phases">' +
        PHASES.map(function (x, i) {
          var cls = i < pIndex ? 'done' : (i === pIndex ? 'now' : '');
          return '<div class="phase ' + cls + '"><span class="line"></span><span class="t">' + esc(x.label) + '</span></div>';
        }).join('') + '</div>';

      var next = PHASES[pIndex + 1];
      var packingBlocksAdvance = packingRequired && !packingComplete(o);
      if (pIndex > 0 || !next) {
        html += '<div class="actions">' +
          (next ? '<button type="button" class="btn" data-advance="1"' + (phasePending || packingBlocksAdvance ? ' disabled' : '') + '>Lanjut: ' + esc(next.label) + '</button>'
                : '<span class="why">Pesanan selesai.</span>') +
          (pIndex > 0 ? '<button type="button" class="btn ghost" data-retreat="1"' + (phasePending ? ' disabled' : '') + '>Kembali</button>' : '') +
          (pIndex > 0 ? '<button type="button" class="btn ghost" data-sendphase="1">Kirim pesan</button>' : '') +
          (phaseErr && pIndex > 0 ? '<span class="why err">' + esc(phaseErr) + '</span>' :
            (packingBlocksAdvance ? '<span class="why">Centang dulu semua item pengecekan kemasan di atas.</span>' : '')) +
          '</div>';
      }
      html += '</div>';
    }
