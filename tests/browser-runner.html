<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Alxanthia Real Browser Automated Spec</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #111; color: #eee; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; font-weight: bold; }
    iframe { width: 600px; height: 400px; border: 1px solid #444; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>ALXANTHIA REAL-BROWSER TEST RUNNER</h1>
  <div id="status">Loading application iframe...</div>
  <pre id="results"></pre>
  <iframe id="app-frame" title="Alxanthia application under test"></iframe>

  <script>
    const resultsEl = document.getElementById('results');
    const statusEl = document.getElementById('status');
    const iframe = document.getElementById('app-frame');
    const logs = [];

    function assert(name, condition, details = '') {
      if (condition) {
        logs.push(`✔ PASS: ${name}`);
      } else {
        logs.push(`✖ FAIL: ${name} (${details})`);
      }
    }

    iframe.onload = async () => {
      statusEl.textContent = 'App loaded. Executing real-browser interactions...';
      const doc = iframe.contentDocument;
      const win = iframe.contentWindow;

      try {
        // Step 0: Ensure app is initialized
        assert('App window and DOM ready', win.AlxanthiaApp !== undefined);

        // Test 1: Stem add stays in place (UX-01). This reverses the earlier
        // A3 behaviour that moved focus to #finish-label.
        const stemBtn = doc.querySelector('.btn-order-stem');
        const finishLabel = doc.getElementById('finish-label');
        if (stemBtn && finishLabel) {
          stemBtn.focus();
          const scrollBefore = win.scrollY;
          stemBtn.click();
          assert('Stem add keeps focus on the clicked button', doc.activeElement === stemBtn);
          assert('First stem add leaves scrollY unchanged', Math.abs(win.scrollY - scrollBefore) <= 2, `before ${scrollBefore}, after ${win.scrollY}`);
          assert('Stem add button shows the "added" confirmation', stemBtn.classList.contains('is-added'));
        } else {
          assert('Stem pick elements present', false, 'stemBtn or finishLabel missing');
        }

        // Test 2: Real Textarea typing & safe binding (C1, R02) — the message
        // card note is a paid, checkbox-gated add-on, so it must be enabled
        // before its textarea appears in the order summary.
        const cardToggle = doc.getElementById('card-note-toggle');
        if (cardToggle && !cardToggle.checked) {
          cardToggle.click();
        }
        const noteInput = doc.getElementById('card-note-input');
        const includesList = doc.getElementById('summary-includes-list');
        if (noteInput && includesList) {
          noteInput.value = '<script>alert("xss")</' + 'script>Selamat Ulang Tahun!';
          noteInput.dispatchEvent(new win.Event('input', { bubbles: true }));
          const noteLi = Array.from(includesList.children).find(li => li.textContent.includes('Selamat Ulang Tahun!'));
          assert(
            'Real textarea typing creates includes item in order summary',
            noteLi !== undefined,
            `includes count: ${includesList.children.length}`
          );
          assert(
            'Gift note safely renders with textContent without injecting script tags',
            noteLi && noteLi.querySelector('script') === null && noteLi.textContent.includes('<script>'),
            noteLi ? noteLi.innerHTML : 'no item'
          );
        } else {
          assert('Card note elements present', false);
        }

        // Test 3: Wrap Chips WAI-ARIA Radio Arrow Navigation (A3, R05).
        // Paper-colour controls are intentionally hidden for stem-only carts,
        // so add a bouquet before exercising keyboard focus inside the group.
        win.AlxanthiaApp.selectPackage(0, false);
        const wrapChips = doc.getElementById('wrap-chips');
        if (wrapChips) {
          let radios = Array.from(wrapChips.querySelectorAll('[role="radio"]'));
          assert('Wrap chips role="radio" declared', radios.length >= 3);
          radios[0].focus();
          radios[0].dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
          
          // Re-query chips after render
          const currentRadios = Array.from(wrapChips.querySelectorAll('[role="radio"]'));
          assert('ArrowRight advances focus to second radio', doc.activeElement === currentRadios[1]);
          assert('Second radio has aria-checked="true"', currentRadios[1].getAttribute('aria-checked') === 'true');
        }

        // Test 4: Package selection keeps focus on the clicked button.
        // DEV-24 used to move focus to #finish-label; UX-01 reversed that.
        // Scoped to #packages-grid: mini-pot "add" buttons also carry the
        // shared .btn-choose-bouquet class for styling, so an unscoped
        // selector can pick one of those up instead of a real package button.
        const pkgBtns = Array.from(doc.querySelectorAll('#packages-grid .btn-choose-bouquet'));
        if (pkgBtns.length > 1 && finishLabel) {
          const targetBtn = pkgBtns[1];
          targetBtn.focus();
          targetBtn.click();

          assert(
            'Package pick keeps focus on the clicked button',
            doc.activeElement === targetBtn,
            `active: ${doc.activeElement ? (doc.activeElement.id || doc.activeElement.className) : 'none'}`
          );
        } else {
          assert('Package choose buttons and #finish-label present', false);
        }

        // Test 5: Modal Open, Close, and Focus Return (R05, C1)
        const photoWrapper = doc.querySelector('.flower-photo-wrapper');
        const modal = doc.getElementById('image-modal');
        const modalClose = doc.getElementById('image-modal-close');
        if (photoWrapper && modal && modalClose) {
          photoWrapper.focus();
          const triggerBefore = doc.activeElement;
          photoWrapper.click();
          assert('Modal opens on photo click', modal.open || modal.hasAttribute('open'));

          // Close modal via close button
          modalClose.click();
          assert('Modal closes on close click', !modal.open && !modal.hasAttribute('open'));
          assert('Focus returns cleanly to photo trigger after button close', doc.activeElement === triggerBefore);

          // Test Escape key close & focus return
          photoWrapper.click();
          modal.dispatchEvent(new win.KeyboardEvent('cancel', { bubbles: true, cancelable: true }));
          if (modal.open) modal.close();
          assert('Escape/cancel closes modal and returns focus', doc.activeElement === triggerBefore);
        } else {
          assert('Modal elements present', false, `photoWrapper: ${!!photoWrapper}, modal: ${!!modal}, modalClose: ${!!modalClose}`);
        }

        // Test 6: Category Filter Tabs navigation (B1)
        const tabBouquets = doc.getElementById('cat-tab-bouquets');
        const colSection = doc.getElementById('collection');
        const bouqSection = doc.getElementById('bouquets');
        if (tabBouquets && colSection && bouqSection) {
          tabBouquets.click();
          assert(
            'Category tab "bouquets" shows bouquets and dims/hides stem collection',
            tabBouquets.getAttribute('aria-pressed') === 'true' &&
            colSection.style.display === 'none' &&
            bouqSection.style.display !== 'none'
          );
        }

        // Test 7: Mobile Custom Builder Accordion Toggle (B1)
        const toggleBtn = doc.getElementById('btn-toggle-custom');
        const builderBody = doc.getElementById('custom-builder-body');
        if (toggleBtn && builderBody) {
          toggleBtn.click();
          assert(
            'Custom builder toggles to collapsed state',
            toggleBtn.getAttribute('aria-expanded') === 'false' && builderBody.classList.contains('collapsed')
          );
          toggleBtn.click();
          assert(
            'Custom builder toggles back to expanded state',
            toggleBtn.getAttribute('aria-expanded') === 'true' && !builderBody.classList.contains('collapsed')
          );
        }

        // Test 8: Checkout review only mentions wrap colour for bouquets (UX-03)
        win.AlxanthiaApp.resetToInitial();
        win.AlxanthiaApp.selectMiniPot('daisy', false);
        const checkoutBtn = doc.getElementById('btn-checkout');
        const finishEl = doc.getElementById('checkout-finish');
        const checkoutModal = doc.getElementById('checkout-modal');
        if (checkoutBtn && finishEl && checkoutModal) {
          checkoutBtn.click();
          assert(
            'Mini-pot-only review does not mention wrap colour',
            finishEl.hidden || !/Bungkus|Wrap/.test(finishEl.textContent),
            finishEl.textContent
          );
          doc.getElementById('checkout-close').click();
          win.AlxanthiaApp.selectPackage(0, false);
          checkoutBtn.click();
          assert(
            'Review with a bouquet shows the wrap colour',
            !finishEl.hidden && /Bungkus|Wrap/.test(finishEl.textContent),
            finishEl.textContent
          );
          doc.getElementById('checkout-close').click();
          win.AlxanthiaApp.resetToInitial();
        } else {
          assert('UX-03 checkout elements present', false);
        }

        // Test 9: Add buttons name their product via aria-describedby (UX-06)
        [
          ['stem add buttons', '.btn-order-stem'],
          ['mini-pot add buttons', '.btn-add-mini-pot'],
          ['package choose buttons', '#packages-grid .btn-choose-bouquet']
        ].forEach(([label, sel]) => {
          const btns = Array.from(doc.querySelectorAll(sel));
          const names = btns.map(b => {
            const el = doc.getElementById(b.getAttribute('aria-describedby') || '');
            return el ? el.textContent.trim() : '';
          });
          assert(`All ${label} have aria-describedby resolving to non-empty text`, btns.length > 0 && names.every(n => n !== ''), JSON.stringify(names));
          // Stems have two buttons per card (wrapped / unwrapped), so compare unique-per-card
          const unique = new Set(names);
          const perCard = sel === '.btn-order-stem' ? btns.length / 2 : btns.length;
          assert(`Described-by texts of ${label} are unique per card`, unique.size === perCard, `${unique.size} unique vs ${perCard} cards`);
        });

        statusEl.textContent = 'All real-browser interactions executed successfully.';
        statusEl.className = 'pass';
      } catch (err) {
        statusEl.textContent = 'Execution Error: ' + err.message;
        statusEl.className = 'fail';
        logs.push(`✖ EXCEPTION: ${err.message}\n${err.stack}`);
      }

      resultsEl.textContent = logs.join('\n');
      console.log('BROWSER_SPEC_RESULTS:\n' + logs.join('\n'));
      document.body.setAttribute('data-done', 'true');
    };

    // The production app intentionally no longer accepts a passcode through
    // the URL. Seed the same non-sensitive browser flag used by the main
    // Playwright suite before navigating the same-origin iframe, so focus is
    // not trapped by the private-preview lock screen during these tests.
    try {
      iframe.contentWindow.localStorage.setItem('alxanthia_unlocked', 'true');
    } catch (e) {}
    iframe.src = '../index.html';
  </script>
</body>
</html>
