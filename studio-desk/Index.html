    /* One story, not three: notes auto-save on blur, and the status line
       says what's actually true — quiet when saved, honest while saving or
       failed, with a retry only when there's something to retry. The old
       explicit Simpan catatan button was usually a no-op (tapping anything
       else already blurred and saved the field) and taught the opposite of
       what was happening. See P3-7 in STUDIO-DESK-UX-REVIEW.md. */
    var unsavedNote = noteDrafts[o.ref] !== undefined && noteDrafts[o.ref] !== o.notes;
    var notesErr = fieldErrors[o.ref + '|notes'];
    var notesStatusLabel = notesErr ? 'Gagal menyimpan' : (unsavedNote && !notesPending ? 'Belum tersimpan' : '');
    html += '<div class="block"><h3 data-fk="notesHeading" tabindex="-1">Catatan kerja' +
      (notesStatusLabel ? '<span class="count" style="color:' + (notesErr ? 'var(--madder)' : 'var(--amber)') +
        ';text-transform:none">' + esc(notesStatusLabel) + '</span>' : '') +
      '</h3>' +
      '<textarea class="notes" id="notes-' + esc(o.ref) + '" data-fk="notes" ' +
      (notesPending ? 'disabled ' : '') +
      'placeholder="Catat kalau ada bahan kurang, warna diganti, atau pesan dari pembeli…"></textarea>' +
      '<span class="why" id="notesSaving"' + (notesPending ? '' : ' hidden') + '>Menyimpan…</span>' +
      (notesErr ? '<div class="actions"><span class="why err">' + esc(notesErr) + '</span>' +
        '<button type="button" class="btn ghost small" data-retrynotes="1">Coba lagi</button></div>' : '') +
      '</div>' +
      cancelBlock(o) +
      riwayatBlock(o) +
      '<details class="provenance"><summary>Info teknis</summary>' +
      '<span>Orders · baris ' + o.row + '</span>' +
      '<span>Desk menulis: Payment Plan · Payment Status · Shipping Fee · Work Phase · Internal Notes</span>' +
      '<span>Kolom lain hanya dibaca</span></details>';

    var scrollY = window.scrollY;
    elTicket.innerHTML = html;
    var notesEl = elTicket.querySelector('.notes');
    notesEl.value = noteDrafts[o.ref] !== undefined ? noteDrafts[o.ref] : o.notes;

    /* A full re-render (payment/phase actions) drops focus to <body> unless
       something claims it back — the single biggest reason a keyboard or
       screen-reader user was returned to the top of the document after
       every action. If the exact control named by `refocus` didn't survive
       the change (e.g. it advanced past the phase it belonged to), fall
       back to the nearest block heading rather than losing focus entirely.
       See P4-4 in STUDIO-DESK-UX-REVIEW.md. */
    if (refocus) {
      var target = elTicket.querySelector('[data-fk="' + refocus + '"]') || elTicket.querySelector('.block > h3[data-fk]');
      if (target) target.focus();
      refocus = null;
    }
    window.scrollTo(0, scrollY);

    var nowPhase = elTicket.querySelector('.phase.now');
    var phasesEl = elTicket.querySelector('.phases');
    if (nowPhase && phasesEl) scrollIntoViewHorizontally(phasesEl, nowPhase);
  }

  /* Local bench-state toggles (comp ticks, the manual gate tick) never touch
     the server, so they update the DOM in place instead of tearing down and
     rebuilding the whole ticket for one checkbox — see P1-4 in
     STUDIO-DESK-UX-REVIEW.md. */
  function updateCompCount() {
    var o = findOrder(state.selected);
    if (!o) return;
    var comps = buildList(o, state.catalog);
    var compState = per(o.ref).comps || {};
    var doneComps = comps.filter(function (c) { return compState[c.key]; }).length;
    var countEl = document.getElementById('compCount');
    if (countEl) countEl.textContent = doneComps + '/' + comps.length + ' item';
  }

  function updateAdvanceButtonState() {
    var o = findOrder(state.selected);
    if (!o) return;
    var btn = elTicket.querySelector('[data-advance]');
    if (!btn) return;
    var g = gate(o, state.catalog);
    var phasePending = isPending(o.ref, 'phase');
    btn.disabled = !(g.ready && !phasePending);
    btn.textContent = (g.ready && !g.allOk) ? 'Tetap mulai kerjakan' : 'Mulai kerjakan';
    var why = btn.nextElementSibling;
    if (why && why.classList.contains('why')) {
      var phaseErr = fieldErrors[o.ref + '|phase'];
      why.classList.toggle('err', !!phaseErr);
      why.textContent = phaseErr || (g.ready
        ? (g.allOk ? '' : 'Tanggalnya sudah lewat — kabari pembeli dulu kalau perlu.')
        : (g.autoOk ? 'Centang baris di atas dulu.' : 'Belum bisa dimulai — lihat tanda merah di atas.'));
    }
  }

  /* The phase block's own Lanjut button (distinct from the gate's Mulai
     kerjakan above — only one or the other is ever in the DOM at a time,
     since the gate only renders at pIndex <= 0 and this block's actions
     only render at pIndex > 0). Gated on the packing checklist while
     leaving Dirangkai dan dikemas. See SD-02. */
  function updatePhaseAdvanceButtonState() {
    var o = findOrder(state.selected);
    if (!o) return;
    var btn = elTicket.querySelector('[data-advance]');
    if (!btn) return;
    var phasePending = isPending(o.ref, 'phase');
    var packingRequired = o.phase === 'Assembly and packing';
    var packingBlocksAdvance = packingRequired && !packingComplete(o);
    btn.disabled = phasePending || packingBlocksAdvance;
    var why = btn.nextElementSibling;
    if (why && why.classList.contains('why')) {
      var phaseErr = fieldErrors[o.ref + '|phase'];
      why.classList.toggle('err', !!phaseErr);
      why.textContent = phaseErr || (packingBlocksAdvance ? 'Centang dulu semua item pengecekan kemasan di atas.' : '');
    }
  }

  /* =====================================================================
     Toasts
     ===================================================================== */
  var toastTimer = null;
  function toast(message, isError) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast';
      el.id = 'toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.className = 'toast' + (isError ? ' err' : '');
    el.innerHTML = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
  }

  /* Indonesian labels for the five writable fields — keyed by the page-side
     field name, never the sheet's own column header, so that English column
     text can never reach a string she actually sees. See P3-1 in
     STUDIO-DESK-UX-REVIEW.md. */
  var FIELD_LABELS = {
    paymentPlan: 'Cara pembayaran',
    payment: 'Status pembayaran',
    shipping: 'Ongkir',
    phase: 'Tahap kerja',
    notes: 'Catatan kerja'
  };

  function savedToast(field) {
    toast((FIELD_LABELS[field] || 'Perubahan') + ' tersimpan.');
  }

  /* =====================================================================
     Writes: optimistic with rollback. Applied locally, rendered, sent to
     the server; on success the order is replaced with the server's own
     copy, on failure the previous value comes back and the control
     re-enables so a double-tap can't queue two writes.
     ===================================================================== */
  /* Reflects an in-flight write on a single control without rebuilding the
     ticket — used for fields written from a 'change' handler (see
     writeField's rerender:false path). */
  function setControlPending(field, isPending) {
    if (field === 'shipping') {
      var input = elTicket.querySelector('.ongkir input[type="number"]');
      var marker = document.getElementById('shippingSaving');
      if (input) input.disabled = isPending;
      if (marker) marker.hidden = !isPending;
    } else if (field === 'notes') {
      var textarea = elTicket.querySelector('.notes');
      var marker = document.getElementById('notesSaving');
      if (textarea) textarea.disabled = isPending;
      if (marker) marker.hidden = !isPending;
    }
  }

  function writeField(ref, field, value, opts) {
    opts = opts || {};
    var onSaved = opts.onSaved;
    var key = ref + '|' + field;
    if (pending[key]) return;
    /* Never even attempt an optimistic write while offline — better a
       clear "not saved" message now than a change that quietly never
       reaches the server. See P5-1 in STUDIO-DESK-UX-REVIEW.md. */
    if (!navigator.onLine) {
      toast('Tidak ada koneksi — perubahan belum tersimpan.', true);
      return;
    }
    var order = findOrder(ref);
    if (!order) return;
    var previous = order[field];

    pending[key] = true;
    delete fieldErrors[key];
    order[field] = value;
    /* A field reached via the 'change' event (shipping, notes) fires on
       blur, which on a touch device races the next tap. Tearing the ticket
       down with a full render() here would detach the button she is mid-tap
       on. Update just that one control in place instead; the server
       response re-renders the whole ticket anyway, long after the tap has
       resolved. */
    if (opts.rerender === false) {
      setControlPending(field, true);
    } else {
      render();
    }

    google.script.run
      .withSuccessHandler(function (res) {
        delete pending[key];
        if (res && res.ok) {
          var idx = state.orders.findIndex(function (x) { return x.ref === res.order.ref; });
          if (idx !== -1) state.orders[idx] = res.order;
          savedToast(field);
          if (onSaved) onSaved();
        } else {
          order[field] = previous;
          fieldErrors[key] = (res && res.message) || 'Gagal menyimpan perubahan.';
          toast(esc(fieldErrors[key]), true);
        }
        render();
      })
      .withFailureHandler(function (err) {
        delete pending[key];
        order[field] = previous;
        fieldErrors[key] = String((err && err.message) || err || 'Gagal menyimpan perubahan.');
        toast(esc(fieldErrors[key]), true);
        render();
      })
      .updateOrder({ ref: ref, row: order.row, field: field, value: value });
  }

  /* The draft is cleared only once the server confirms the write — not on
     blur, and not just because a send button was tapped — so a WhatsApp
     round trip (or any other navigation away) can never silently drop an
     unsaved note. */
  function saveNotes(o) {
    var value = noteDrafts[o.ref] !== undefined ? noteDrafts[o.ref] : o.notes;
    if (value === o.notes) {
      delete noteDrafts[o.ref];
      saveNoteDrafts();
      renderTicket();
      return;
    }
    writeField(o.ref, 'notes', value, {
      rerender: false,
      onSaved: function () {
        delete noteDrafts[o.ref];
        saveNoteDrafts();
      }
    });
  }

  /* =====================================================================
     Boot: fetch the catalogue and the order list in parallel.
     ===================================================================== */
  function boot() {
    state.ordersError = null;
    state.catalogError = null;
    render();

    google.script.run
      .withSuccessHandler(function (catalog) { state.catalog = catalog; render(); })
      .withFailureHandler(function (err) {
        state.catalogError = String((err && err.message) || err);
        state.catalog = { stale: true, flowers: {}, pots: {}, additions: {},
                          packages: [], wraps: {}, minimumLeadDays: 2, bank: {} };
        render();
      })
      .getCatalog();

    google.script.run
      .withSuccessHandler(function (orders) { state.orders = orders; ordersFetchedAt = new Date(); render(); })
      .withFailureHandler(function (err) { state.ordersError = String((err && err.message) || err); render(); })
      .listOrders();
  }

  function reloadOrders() {
    elRefreshBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function (orders) {
        elRefreshBtn.disabled = false;
        state.orders = orders;
        ordersFetchedAt = new Date();
        render();
      })
      .withFailureHandler(function (err) {
        elRefreshBtn.disabled = false;
        toast(esc(String((err && err.message) || err)), true);
      })
      .listOrders();
  }

  /* =====================================================================
     Events
     ===================================================================== */
  elRetryBtn.addEventListener('click', boot);
  elRefreshBtn.addEventListener('click', reloadOrders);
  elReloadCatalogBtn.addEventListener('click', function () {
    elReloadCatalogBtn.disabled = true;
    google.script.run
      .withSuccessHandler(function (catalog) {
        elReloadCatalogBtn.disabled = false;
        state.catalog = catalog;
        render();
      })
      .withFailureHandler(function (err) {
        elReloadCatalogBtn.disabled = false;
        toast(esc(String((err && err.message) || err)), true);
      })
      .refreshCatalog();
  });

  document.getElementById('themeSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-theme-choice]');
    if (!b) return;
    themeChoice = b.dataset.themeChoice;
    try { localStorage.setItem(THEME_KEY, themeChoice); } catch (err) {}
    applyTheme(themeChoice);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && state.orders !== null) reloadOrders();
  });

  window.addEventListener('online', function () { if (state.orders !== null) render(); });
  window.addEventListener('offline', function () { if (state.orders !== null) render(); });

  elChips.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lane]');
    if (!b) return;
    state.lane = b.dataset.lane;
    render();
  });

  elPulse.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lane]');
    if (!b) return;
    state.lane = b.dataset.lane;
    render();
  });

  elSort.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-sort]');
    if (!b) return;
    state.sort = b.dataset.sort;
    render();
  });

  elSearch.addEventListener('input', function () {
    state.search = elSearch.value;
    render();
  });

  /* Master/detail on mobile is CSS state (body.detail), so the phone's own
     back gesture would otherwise leave the Desk entirely rather than close
     the ticket. Push a history entry when one opens and let popstate close
     it, so the gesture and the in-page back button share one path. The Desk
     runs inside the Apps Script /exec sandbox iframe, where history
     manipulation can be restricted — if pushState throws, historyPushed
     stays false and the in-page button falls back to closing the view
     directly instead of touching history at all. */
  var historyPushed = false;

  function closeDetail() {
    document.body.classList.remove('detail');
  }

  window.addEventListener('popstate', function () {
    historyPushed = false;
    closeDetail();
  });

  elQueue.addEventListener('click', function (e) {
    var cross = e.target.closest('[data-crosslane]');
    if (cross) {
      state.lane = cross.dataset.crosslane;
      render();
      return;
    }

    var b = e.target.closest('button[data-ref]');
    if (!b) return;
    state.selected = b.dataset.ref;
    confirming = false;
    document.body.classList.add('detail');
    /* body.detail only changes anything below the 900px master/detail
       breakpoint — above it, pushing history on every card tap left a Back
       press that visibly did nothing. See P5-3 in STUDIO-DESK-UX-REVIEW.md. */
    if (window.matchMedia('(max-width: 899px)').matches) {
      try {
        history.pushState({ desk: 'detail', ref: state.selected }, '');
        historyPushed = true;
      } catch (e) { historyPushed = false; }
    }
    renderQueue();
    renderTicket();
    elTicket.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });

  elTicket.addEventListener('click', function (e) {
    var o = findOrder(state.selected);
    if (!o) return;
    var p = per(o.ref);

    if (e.target.closest('[data-back]')) {
      if (historyPushed) { historyPushed = false; history.back(); } else { closeDetail(); }
      return;
    }

    var tick = e.target.closest('[data-tick]');
    if (tick) {
      p.ticks = p.ticks || {};
      var tickOn = !p.ticks[tick.dataset.tick];
      p.ticks[tick.dataset.tick] = tickOn;
      savePer();
      tick.setAttribute('aria-pressed', String(tickOn));
      updateAdvanceButtonState();
      if (tick.dataset.tick === 'card') syncChecklistItem(o.ref, 'gate:card-read', 'v1', tickOn);
      return;
    }

    var comp = e.target.closest('[data-comp]');
    if (comp) {
      p.comps = p.comps || {};
      var compOn = !p.comps[comp.dataset.comp];
      p.comps[comp.dataset.comp] = compOn;
      savePer();
      comp.setAttribute('aria-pressed', String(compOn));
      updateCompCount();
      syncChecklistItem(o.ref, comp.dataset.contentkey, comp.dataset.contentkey, compOn);
      return;
    }

    var packing = e.target.closest('[data-packing]');
    if (packing) {
      p.packing = p.packing || {};
      var packingOn = !p.packing[packing.dataset.packing];
      p.packing[packing.dataset.packing] = packingOn;
      savePer();
      packing.setAttribute('aria-pressed', String(packingOn));
      updatePhaseAdvanceButtonState();
      syncChecklistItem(o.ref, 'packing:' + packing.dataset.packing, 'v1', packingOn);
      return;
    }

    if (e.target.closest('[data-markreviewed]')) { markReviewedAction(o); return; }

    if (e.target.closest('[data-openledgerform]')) {
      recordingPayment = { type: 'receipt', amount: '' };
      paymentIdempotencyKey = generateIdempotencyKey();
      renderTicket();
      return;
    }
    var ledgerTypeBtn = e.target.closest('[data-ledgertype]');
    if (ledgerTypeBtn && recordingPayment) {
      var amountInput = document.getElementById('ledgeramount');
      if (amountInput) recordingPayment.amount = amountInput.value;
      recordingPayment.type = ledgerTypeBtn.dataset.ledgertype;
      renderTicket();
      return;
    }
    if (e.target.closest('[data-cancelledgerform]')) {
      recordingPayment = false;
      paymentIdempotencyKey = null;
      renderTicket();
      return;
    }
    if (e.target.closest('[data-submitledger]')) { submitLedgerRecord(o); return; }

    var payBtn = e.target.closest('[data-pay]');
    if (payBtn) {
      confirming = false;
      refocus = 'paymentHeading';
      writeField(o.ref, 'payment', payBtn.dataset.pay);
      return;
    }

    var planBtn = e.target.closest('[data-plan]');
    if (planBtn) {
      refocus = 'paymentHeading';
      writeField(o.ref, 'paymentPlan', planBtn.dataset.plan);
      return;
    }

    var askPaid = e.target.closest('[data-askpaid]');
    if (askPaid) { confirming = askPaid.dataset.askpaid; refocus = 'confirm-primary'; renderTicket(); return; }
    if (e.target.closest('[data-askcancel]')) { confirming = 'cancel'; refocus = 'confirm-primary'; renderTicket(); return; }
    if (e.target.closest('[data-cancelconfirm]')) { confirming = false; refocus = 'paymentHeading'; renderTicket(); return; }

    if (e.target.closest('[data-advance]')) {
      var i = PHASES.findIndex(function (x) { return x.key === o.phase; });
      if (PHASES[i + 1] && PHASES[i + 1].key === 'Shipped' && o.payment !== 'Paid') {
        toast('Pelunasan harus diterima sebelum pesanan dikirim.', true);
        return;
      }
      if (PHASES[i + 1]) {
        var becomingDelivered = PHASES[i + 1].key === 'Delivered';
        refocus = 'phaseHeading';
        writeField(o.ref, 'phase', PHASES[i + 1].key, becomingDelivered ? {
          onSaved: function () { toast('Pesanan selesai. Dipindahkan ke daftar Selesai.'); }
        } : undefined);
      }
      return;
    }

    if (e.target.closest('[data-retreat]')) {
      var j = PHASES.findIndex(function (x) { return x.key === o.phase; });
      if (j > 0) { refocus = 'phaseHeading'; writeField(o.ref, 'phase', PHASES[j - 1].key); }
      return;
    }

    var copyCard = e.target.closest('[data-copycard]');
    if (copyCard && o.card) {
      copyText(o.card.text + '\n— ' + o.card.from);
      copyCard.textContent = 'Tersalin';
      /* Revert after a couple of seconds, matching the toast's own timing —
         otherwise the button can keep reading "Tersalin" long after she's
         scrolled past this order. See P5-4 in STUDIO-DESK-UX-REVIEW.md. */
      setTimeout(function () {
        if (document.body.contains(copyCard)) copyCard.textContent = 'Salin teks kartu';
      }, 2600);
      return;
    }

    if (e.target.closest('[data-sendpayment]')) {
      if (billed(o) === null) return;
      openWhatsApp(o, paymentRequestMessage(o, e.target.closest('[data-sendpayment]').dataset.sendpayment));
      return;
    }

    if (e.target.closest('[data-sendpaid]')) {
      openWhatsApp(o, paymentConfirmedMessage(o));
      return;
    }

    if (e.target.closest('[data-sendphase]')) {
      var msg = phaseMessage(o);
      if (msg) openWhatsApp(o, msg);
      return;
    }

    if (e.target.closest('[data-retrynotes]')) {
      refocus = 'notesHeading';
      saveNotes(o);
      return;
    }
  });

  elTicket.addEventListener('change', function (e) {
    var o = findOrder(state.selected);
    if (!o) return;

    if (e.target.classList.contains('notes')) {
      saveNotes(o);
      return;
    }
    if (e.target.type !== 'number') return;
    var raw = e.target.value.trim();
    var value = raw === '' ? '' : Math.max(0, Number(raw));
    writeField(o.ref, 'shipping', value, { rerender: false });
  });

  elTicket.addEventListener('input', function (e) {
    if (e.target.classList.contains('notes')) {
      noteDrafts[state.selected] = e.target.value;
      saveNoteDrafts();
      return;
    }
    if (e.target.matches('.ongkir .amtwrap input')) {
      updateOngkirEcho(e.target.value);
      return;
    }
  });

  /* Live "= Rp 45.000" echo and total, updated as she types — display only,
     never touches the input's own value or state.orders. See P3-4 in
     STUDIO-DESK-UX-REVIEW.md. */
  function updateOngkirEcho(raw) {
    var n = raw === '' ? NaN : Number(raw);
    var valid = raw !== '' && isFinite(n) && n >= 0;
    var echo = document.getElementById('ongkirEcho');
    if (echo) echo.textContent = valid ? '= ' + rupiah(n) : '';
    var o = findOrder(state.selected);
    var bigEl = elTicket.querySelector('.amount .big');
    if (o && bigEl) bigEl.textContent = valid ? rupiah(o.verified + n) : '—';
  }

  function copyText(text) {
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
  }

  /* Opens the buyer's WhatsApp chat with the message already typed in,
     ready to send — never sent automatically, she still taps send herself.
     A new top-level window, not the Apps Script iframe (wa.me refuses to
     render framed). */
  function openWhatsApp(o, message) {
    var digits = String(o.wa || '').replace(/[^\d]/g, '');
    var url = 'https://wa.me/' + digits + '?text=' + encodeURIComponent(message);
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  function paymentRequestMessage(o, kind) {
    var amount = billed(o);
    var bank = state.catalog.bank || {};
    if (kind === 'deposit') {
      return 'Halo ' + firstName(o.buyer) + ', terima kasih untuk pesanannya.\n' +
        'Nomor pesanan: ' + o.ref + '\nTotal pesanan: ' + rupiah(amount) + '\n' +
        'DP 50%: ' + rupiah(depositAmount(o)) + '\nSisa pelunasan: ' + rupiah(balanceAmount(o)) + '\n' +
        'Transfer ke ' + bank.bank + ' ' + bank.number + ' a.n. ' + bank.holder + '\n' +
        'Kalau sudah, balas chat ini ya. Produksi dimulai setelah DP kami konfirmasi.';
    }
    if (kind === 'balance') {
      return 'Halo ' + firstName(o.buyer) + ', pesananmu (' + o.ref + ') sudah siap dikirim.\n' +
        'Total pesanan: ' + rupiah(amount) + '\nDP sudah diterima: ' + rupiah(depositAmount(o)) + '\n' +
        'Sisa pelunasan: ' + rupiah(balanceAmount(o)) + '\n' +
        'Transfer ke ' + bank.bank + ' ' + bank.number + ' a.n. ' + bank.holder + '\n' +
        'Setelah pelunasan kami konfirmasi, pesanan siap dikirim. Terima kasih!';
    }
    return 'Halo ' + firstName(o.buyer) + ', terima kasih untuk pesanannya.\n' +
      'Nomor pesanan: ' + o.ref + '\n' +
      'Total: ' + rupiah(amount) + '\n' +
      'Transfer ke ' + bank.bank + ' ' + bank.number + ' a.n. ' + bank.holder + '\n' +
      'Kalau sudah, balas chat ini ya — nanti kami cek dan langsung dikerjakan untuk ' + fmtDate(o.date) + '.';
  }

  function paymentConfirmedMessage(o) {
    if (usesDeposit(o)) {
      return 'Halo ' + firstName(o.buyer) + ', pelunasan pesanan ' + o.ref + ' sudah kami terima. ' +
        'Status pembayaran sekarang lunas. Terima kasih!';
    }
    return 'Halo ' + firstName(o.buyer) + ', pembayaran untuk pesanan ' + o.ref + ' sudah kami terima. ' +
      'Terima kasih! Pesananmu akan segera kami mulai buatkan.';
  }

  /* One message per work phase, shown once she's already advanced into it —
     "Kirim pesan" sits next to Kembali for every phase past Belum mulai. */
  function phaseMessage(o) {
    var name = firstName(o.buyer);
    if (o.phase === 'Assembly and packing') {
      return 'Halo ' + name + ', pesananmu (' + o.ref + ') sedang kami rangkai dan kemas. Kami kabari lagi begitu siap ya.';
    }
    if (o.phase === 'Ready for dispatch') {
      if (o.locationType === 'bali') {
        return o.method === 'self_pickup'
          ? 'Halo ' + name + ', pesananmu (' + o.ref + ') sudah siap diambil di studio kapan saja.'
          : 'Halo ' + name + ', pesananmu (' + o.ref + ') sudah siap. Kamu bisa pesan Gojek/Grab kapan saja untuk mengambilnya.';
      }
      return 'Halo ' + name + ', pesananmu (' + o.ref + ') sudah siap dan akan segera kami kirim.';
    }
    if (o.phase === 'Shipped') {
      return 'Halo ' + name + ', pesananmu (' + o.ref + ') sudah dikirim dan sedang dalam perjalanan menujumu.';
    }
    if (o.phase === 'Delivered') {
      return 'Halo ' + name + ', terima kasih ya! Semoga pesananmu (' + o.ref + ') sudah sampai dengan baik.';
    }
    return null;
  }

  boot();
</script>
